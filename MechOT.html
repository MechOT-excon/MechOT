<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ff:'IBM Plex Sans',sans-serif;--fm:'IBM Plex Mono',monospace;
  --bg:#0d1117;--bg2:#161b27;--bg3:#1e2438;--bg4:#252c40;
  --border:#2a3048;--border2:#3a4260;
  --acc:#f59e0b;--acc2:#3b82f6;--acc3:#10b981;--acc4:#8b5cf6;
  --danger:#ef4444;--warn:#f97316;
  --text:#e2e8f0;--text2:#8892a4;--text3:#4a5270;
}
body{font-family:var(--ff);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;overflow-x:hidden}
.hidden{display:none!important}
input,select,textarea,button{font-family:var(--ff)}
/* LOGIN */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;background:var(--bg)}
.logo-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.4rem}
.logo-icon{width:44px;height:44px;background:var(--acc2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.logo-text{font-family:var(--fm);font-size:20px;font-weight:500;letter-spacing:2px}
.app-sub{font-size:12px;color:var(--text2);margin-bottom:2rem}
/* SHELL */
#app{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.65rem 1rem;padding-top:calc(.65rem + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tbl{display:flex;align-items:center;gap:.6rem}
.tb-logo{font-family:var(--fm);font-size:11px;color:var(--acc2);letter-spacing:2px}
.tb-sep{width:1px;height:14px;background:var(--border2)}
.tbrole{font-size:10px;padding:2px 7px;border-radius:4px;font-family:var(--fm)}
.tbrole.p{background:rgba(59,130,246,.15);color:#93c5fd}
.tbrole.s{background:rgba(16,185,129,.15);color:#6ee7b7}
.tbrole.j{background:rgba(245,158,11,.15);color:#fcd34d}
.tbrole.a{background:rgba(139,92,246,.15);color:#c4b5fd}
.tbn{font-size:12px;color:var(--text2)}
.tbr{display:flex;gap:.4rem;align-items:center}
.ab{position:relative;background:none;border:1px solid var(--border);border-radius:7px;padding:4px 7px;cursor:pointer;color:var(--text2);font-size:15px;transition:.15s}
.ab:hover{border-color:var(--warn);color:var(--warn)}
.adot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid var(--bg2)}
.bl{font-size:11px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:6px;padding:3px 7px;cursor:pointer}
.bl:hover{border-color:var(--danger);color:var(--danger)}
.main{flex:1;padding:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom));overflow-y:auto;max-width:600px;margin:0 auto;width:100%}
/* TABS */
.nt{display:flex;gap:3px;margin-bottom:1rem;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px;overflow-x:auto}
.ntb{flex:1;min-width:fit-content;padding:.4rem .45rem;text-align:center;border-radius:7px;cursor:pointer;font-size:11px;color:var(--text2);border:none;background:none;font-family:var(--ff);white-space:nowrap;transition:.15s}
.ntb.on{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}
/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:.85rem;margin-bottom:.6rem}
.chd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.6rem;gap:.5rem}
.ct{font-weight:500;font-size:13px;line-height:1.4}
.cs{font-size:11px;color:var(--text2);margin-top:2px}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:20px;font-family:var(--fm);white-space:nowrap}
.b-new{background:rgba(139,92,246,.12);color:#c4b5fd;border:1px solid rgba(139,92,246,.25)}
.b-run{background:rgba(59,130,246,.12);color:#93c5fd;border:1px solid rgba(59,130,246,.25)}
.b-pau{background:rgba(249,115,22,.12);color:#fdba74;border:1px solid rgba(249,115,22,.25)}
.b-don{background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.25)}
.b-pen{background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.25)}
/* FORMS */
.fg{margin-bottom:.75rem}
.fl{font-size:10px;color:var(--text2);margin-bottom:.3rem;display:block;letter-spacing:.4px;text-transform:uppercase}
.fi,.fs,.fta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:.5rem .7rem;color:var(--text);font-size:16px;outline:none;transition:border-color .2s}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--acc2)}
.fs option{background:var(--bg2)}
.fta{resize:vertical;min-height:65px;font-size:14px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
/* BUTTONS */
.btn{padding:.6rem 1rem;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:.35rem;transition:.15s;min-height:44px}
.bp{background:var(--acc2);color:#fff}.bp:hover{background:#2563eb}
.bs{background:var(--acc3);color:#fff}.bs:hover{background:#059669}
.bw{background:var(--acc);color:#1a1d26}.bw:hover{background:#d97706}
.bg{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}.bg:hover{color:var(--text)}
.bd{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
.bv{background:rgba(139,92,246,.1);color:#c4b5fd;border:1px solid rgba(139,92,246,.2)}
.bfull{width:100%;justify-content:center}
.bsm{padding:.3rem .6rem;font-size:11px;min-height:32px}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* PROGRESS */
.pbw{background:var(--bg4);border-radius:20px;height:6px;margin:.35rem 0}
.pb{height:6px;border-radius:20px;transition:width .4s}
.pb-b{background:var(--acc2)}.pb-g{background:var(--acc3)}.pb-a{background:var(--acc)}.pb-r{background:var(--danger)}
/* TASK */
.tki{display:flex;align-items:center;gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--border)}
.tki:last-child{border-bottom:none}
.tkc{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tkc.on{background:var(--acc3);border-color:var(--acc3)}
/* STATS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-bottom:.65rem}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.65rem}
.sv{font-size:20px;font-weight:600;font-family:var(--fm);margin-bottom:2px}
.sl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
/* PHOTO */
.pu{border:1.5px dashed var(--border2);border-radius:10px;padding:1rem;text-align:center;cursor:pointer;transition:.2s}
.pu:hover{border-color:var(--acc2)}
.pu.ok{border-style:solid;border-color:var(--acc3);background:rgba(16,185,129,.04)}
.pu i{font-size:22px;color:var(--text3);display:block;margin-bottom:.3rem}
.pu.ok i{color:var(--acc3)}
.pu-txt{font-size:11px;color:var(--text2)}
/* EVAL */
.ei{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:.65rem;margin-bottom:.4rem}
.er{display:flex;align-items:center;gap:.45rem}
.en{font-size:12px;flex:1;line-height:1.3}
.eo{display:flex;gap:.25rem}
.eb{width:26px;height:26px;border-radius:5px;border:1px solid var(--border);background:none;color:var(--text2);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.eb.ok-on{background:rgba(16,185,129,.18);border-color:var(--acc3);color:var(--acc3)}
.eb.nc-on{background:rgba(239,68,68,.18);border-color:var(--danger);color:var(--danger)}
.eb.na-on{background:rgba(100,116,139,.15);border-color:#64748b;color:#94a3b8}
.ncph{margin-top:.4rem;font-size:11px;color:var(--danger);background:rgba(239,68,68,.07);border:1px dashed rgba(239,68,68,.3);border-radius:6px;padding:.3rem .55rem;cursor:pointer;text-align:center}
.ncph.up{border-style:solid;color:#6ee7b7;border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.05)}
/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--bg2);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom));width:100%;max-height:92vh;overflow-y:auto}
.mdt{font-weight:600;font-size:14px;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between}
.mc{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;line-height:1;padding:0 3px}
/* MISC */
.div{height:1px;background:var(--border);margin:.75rem 0}
.hp{font-family:var(--fm);font-size:11px;color:var(--acc);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);border-radius:5px;padding:1px 6px}
.es{text-align:center;padding:2.5rem 1rem;color:var(--text3)}
.es i{font-size:30px;display:block;margin-bottom:.5rem}
.shd{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin:.65rem 0 .4rem;display:flex;align-items:center;gap:.35rem}
.tli{display:flex;gap:.6rem;padding:.35rem 0}
.tld{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
.tag-tipo{font-size:10px;padding:1px 6px;border-radius:4px;background:rgba(59,130,246,.1);color:#93c5fd;border:1px solid rgba(59,130,246,.2);font-family:var(--fm)}
.sf-btn{padding:.3rem .65rem;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:var(--fm)}
.eqcard{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.75rem;margin-bottom:.5rem;display:flex;align-items:center;gap:.75rem;cursor:pointer}
.eqinitials{width:36px;height:36px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:11px;color:var(--acc);flex-shrink:0}
.comcard{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.75rem;margin-bottom:.5rem}
/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem;color:var(--text2)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--acc2);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:.75rem}
@keyframes spin{to{transform:rotate(360deg)}}
input[type=file]{display:none}
input[type=range]{width:100%;accent-color:var(--acc);height:20px;cursor:pointer}
.cwrap{background:var(--bg3);border-radius:8px;padding:.65rem}
.cbars{display:flex;align-items:flex-end;gap:5px;height:100px;padding:0 2px}
.bar{border-radius:2px 2px 0 0;min-height:2px;transition:height .4s}
.blbl{font-size:8px;color:var(--text3);text-align:center;margin-top:.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cleg{display:flex;gap:.65rem;margin-top:.4rem;flex-wrap:wrap}
.lgi{display:flex;align-items:center;gap:.3rem;font-size:10px;color:var(--text2)}
.lgd{width:8px;height:8px;border-radius:2px}
</style>
</head>

<script>
const SUPA_URL = 'https://vqvwdduvpgneunbhllak.supabase.co';
const SUPA_KEY = 'sb_publishable_9PTgSKSxrR8xi03X69WJfw_eGeD7B_C';

// Supabase REST API helpers
const supa = {
  headers: {'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY},
  async get(table, params=''){
    const r=await fetch(`${SUPA_URL}/rest/v1/${table}?${params}`,{headers:this.headers});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async post(table, data){
    const r=await fetch(`${SUPA_URL}/rest/v1/${table}`,{method:'POST',headers:{...this.headers,'Prefer':'return=representation'},body:JSON.stringify(data)});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async patch(table, filter, data){
    const r=await fetch(`${SUPA_URL}/rest/v1/${table}?${filter}`,{method:'PATCH',headers:{...this.headers,'Prefer':'return=representation'},body:JSON.stringify(data)});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async delete(table, filter){
    const r=await fetch(`${SUPA_URL}/rest/v1/${table}?${filter}`,{method:'DELETE',headers:this.headers});
    if(!r.ok) throw new Error(await r.text());
    return true;
  },
  async upload(path, file){
    const r=await fetch(`${SUPA_URL}/storage/v1/object/mechot-fotos/${path}`,{
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':file.type,'x-upsert':'true'},
      body:file
    });
    if(!r.ok) throw new Error(await r.text());
    return `${SUPA_URL}/storage/v1/object/public/mechot-fotos/${path}`;
  }
};
</script>

<script>
// ===================== STATE =====================
const SITIOS=['lo_pinto','la_negra'];
const SITIO_LBL={lo_pinto:'Lo Pinto',la_negra:'La Negra',todos:'Todos','Lo Pinto':'Lo Pinto','La Negra':'La Negra'};
const EC={
  sin_iniciar:{lbl:'Sin Iniciar',cls:'b-new',dot:'#c4b5fd'},
  en_ejecucion:{lbl:'En Ejecución',cls:'b-run',dot:'var(--acc2)'},
  en_proceso:{lbl:'En Proceso',cls:'b-run',dot:'var(--acc2)'},
  pausada:{lbl:'Pausada',cls:'b-pau',dot:'var(--warn)'},
  finalizada:{lbl:'Finalizada',cls:'b-don',dot:'var(--acc3)'}
};

const S={
  role:null,tab:0,userName:'',userEmail:'',
  userSitio:'todos',
  eqFiltro:'',
  areaFiltro:'todos',
  inspFiltro:'todas',
  alerts:[],
  // local cache
  ots:[],equipos:[],tecnicos:[],compromisos:[],inspecciones:[],
  usuarios:[],plantillas:[],
  evalState:null,
  nextOTNum:1
};

const eb=o=>{const c=EC[o.estado]||EC.sin_iniciar;return `<span class="badge ${c.cls}">${c.lbl}</span>`;};
const pbw=p=>{const c=p===100?'pb-g':p>50?'pb-b':p>0?'pb-a':'pb-r';return `<div class="pbw"><div class="pb ${c}" style="width:${p}%"></div></div>`;};
const today=()=>new Date().toISOString().split('T')[0];
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-CL'):'';
const fmtDT=d=>d?new Date(d).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const getEq=cod=>S.equipos.find(e=>e.codigo_interno===cod)||{codigo_interno:cod,nombre:cod,tipo:'—',marca:'—',modelo:'—',anio:'—',sucursal:'—'};
const sitioBadge=s=>`<span style="font-size:9px;padding:1px 6px;border-radius:10px;background:rgba(139,92,246,.1);color:#c4b5fd;border:1px solid rgba(139,92,246,.25);font-family:var(--fm)">${SITIO_LBL[s]||s}</span>`;

const AREAS=['Habilitación','Venta','Repex'];
const AREA_CFG={
  'Habilitación':{col:'var(--acc2)', bg:'rgba(59,130,246,.12)', icon:'ti-tool'},
  'Venta':       {col:'var(--acc3)', bg:'rgba(16,185,129,.12)', icon:'ti-tag'},
  'Repex':       {col:'var(--warn)', bg:'rgba(249,115,22,.12)', icon:'ti-tools'},
};
const areaBadge=area=>{
  const c=AREA_CFG[area]||{col:'var(--text2)',bg:'var(--bg3)'};
  return `<span style="font-size:9px;padding:1px 7px;border-radius:10px;background:${c.bg};color:${c.col};border:1px solid ${c.col};font-family:var(--fm)">${area||'—'}</span>`;
};

function cm(id){document.getElementById(id).classList.add('hidden');}
function visibleEquipos(){
  let eq=S.equipos;
  if(S.userSitio!=='todos') eq=eq.filter(e=>e.sucursal===S.userSitio);
  if(S.areaFiltro&&S.areaFiltro!=='todos') eq=eq.filter(e=>e.area===S.areaFiltro);
  return eq;
}
function visibleOTs(){
  const cods=new Set(visibleEquipos().map(e=>e.codigo_interno));
  return S.ots.filter(o=>cods.has(o.equipo_cod));
}
function visibleCompromisos(){
  const cods=new Set(visibleEquipos().map(e=>e.codigo_interno));
  return S.compromisos.filter(c=>cods.has(c.equipo_cod));
}

}

// ===================== AUTH =====================
async function doLogin(){
  const email=(document.getElementById('login-email').value||'').trim().toLowerCase();
  if(!email){showErr('Ingresa tu email');return;}
  const btn=document.getElementById('login-btn');
  btn.disabled=true; btn.innerHTML='<div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0"></div>';
  try{
    const users=await supa.get('usuarios',`email=eq.${encodeURIComponent(email)}&activo=eq.true&select=*`);
    if(!users.length){showErr('Email no encontrado. Contacta al administrador.');btn.disabled=false;btn.innerHTML='<i class="ti ti-arrow-right"></i> Ingresar';return;}
    const u=users[0];
    S.role=u.rol; S.userName=u.nombre; S.userEmail=u.email;
    S.userSitio=u.sucursal==='todos'?'todos':u.sucursal;
    document.getElementById('login-error').classList.add('hidden');
    await loadAllData();
    showApp();
  }catch(e){showErr('Error de conexión: '+e.message);btn.disabled=false;btn.innerHTML='<i class="ti ti-arrow-right"></i> Ingresar';}
}
function showErr(msg){
  const el=document.getElementById('login-error');
  el.textContent=msg; el.classList.remove('hidden');
}
async function loadAllData(){
  const sucFilter=S.userSitio==='todos'?'':'&sucursal=eq.'+encodeURIComponent(S.userSitio);
  const [ots,equipos,tecs,coms,insps,users,plants]=await Promise.all([
    supa.get('ots',`select=*&order=created_at.desc${sucFilter}`),
    supa.get('equipos','select=*&order=codigo_interno'),
    supa.get('tecnicos','select=*&order=nombre'),
    supa.get('compromisos',`select=*&order=fecha_limite${sucFilter}`),
    supa.get('inspecciones',`select=*&order=fecha_inspeccion.desc${sucFilter}`),
    supa.get('usuarios','select=*&order=nombre'),
    supa.get('plantillas_inspeccion','select=*&order=tipo_inspeccion,tipo_equipo,orden')
  ]);
  S.ots=ots; S.equipos=equipos; S.tecnicos=tecs;
  S.compromisos=coms; S.inspecciones=insps;
  S.usuarios=users; S.plantillas=plants;
  // next OT number
  const nums=S.ots.map(o=>parseInt(o.id_ot.replace(/\D/g,''))||0);
  S.nextOTNum=nums.length?Math.max(...nums)+1:1;
  // Revisar OTs pendientes sin avance / atrasadas
  await checkOTAlerts();
}

// ===================== ALERTAS DE OTs PENDIENTES =====================
// Una OT "en ejecución"/"en proceso" genera alerta si:
//  - Está atrasada según su fecha programada + días estimados (horas_programadas/8, redondeado arriba)
//  - O no tiene actividad (reporte de avance) en las últimas 24h
async function checkOTAlerts(){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const activas=S.ots.filter(o=>['en_ejecucion','en_proceso'].includes(o.estado));
  if(!activas.length) return;

  // Traer el último reporte de avance de cada OT activa en una sola consulta
  let ultimos={};
  try{
    const ids=activas.map(o=>o.id_ot);
    const reportes=await supa.get('reportes_avance',`ot_id=in.(${ids.join(',')})&select=ot_id,fecha_reporte&order=fecha_reporte.desc`);
    reportes.forEach(r=>{ if(!ultimos[r.ot_id]) ultimos[r.ot_id]=r.fecha_reporte; });
  }catch(e){ /* si falla, seguimos sin el dato */ }

  const ahora=new Date();
  activas.forEach(o=>{
    const eq=getEq(o.equipo_cod);
    const diasEstimados=Math.max(1,Math.ceil((o.horas_programadas||1)/8));
    const fechaInicio=new Date(o.fecha_programada+'T00:00:00');
    const fechaLimite=new Date(fechaInicio); fechaLimite.setDate(fechaLimite.getDate()+(diasEstimados-1));
    const atrasada=fechaLimite<hoy;

    // Última actividad: último reporte, o si no hay, fecha de creación
    const ultimaTs=ultimos[o.id_ot]||o.created_at;
    let sinActividad=false;
    if(ultimaTs){
      const horasDesde=(ahora-new Date(ultimaTs))/(1000*60*60);
      sinActividad=horasDesde>24;
    }

    if(atrasada){
      addAlert('crit',`OT ${o.id_ot} atrasada`,`${eq.nombre} · ${o.nombre} · programada ${fmtDate(o.fecha_programada)} (${diasEstimados}d estimado)`);
    } else if(sinActividad){
      addAlert('warn',`OT ${o.id_ot} sin avance reciente`,`${eq.nombre} · ${o.nombre} · sin reportes en +24h`);
    }
  });
}

async function saveNewOT(){
  const nom=document.getElementById('n-nom').value.trim();
  if(!nom){alert('Ingresa nombre');return;}
  const tar=(document.getElementById('n-tar').value.trim()||'Tarea general').split('\n').map(t=>t.trim()).filter(Boolean);
  const eqCod=document.getElementById('n-eq').value;
  const eq=getEq(eqCod);
  const otData={
    id_ot:document.getElementById('n-id').value,
    nombre:nom,
    equipo_cod:eqCod,
    tecnico:document.getElementById('n-tec').value,
    sucursal:eq.sucursal||S.userSitio,
    horas_programadas:parseFloat(document.getElementById('n-hrs').value)||4,
    horas_ejecutadas:0,
    fecha_programada:document.getElementById('n-fecha').value,
    estado:'sin_iniciar',avance_pct:0,
    notas:document.getElementById('n-not').value,
    tareas_json:JSON.stringify(tar.map(n=>({nombre:n,check:false})))
  };
  try{
    const res=await supa.post('ots',otData);
    S.ots.unshift(res[0]);
    S.nextOTNum++;
    cm('m-ot'); renderRole();
  }catch(e){alert('Error al crear OT: '+e.message);}
}

async function deleteOT(id_ot){
  if(!confirm('¿Eliminar esta OT?')) return;
  try{

    S.ots=S.ots.filter(o=>o.id_ot!==id_ot);
    cm('m-det'); renderRole();
  }catch(e){alert('Error: '+e.message);}
}

function renderCumplimiento(tc){

function updCum(){
  const fd=document.getElementById('cfd').value;
  const ods=visibleOTs().filter(o=>o.fecha_programada===fd);
  const comsDia=visibleCompromisos().filter(c=>c.fecha_limite===fd);
  const tot=ods.length; const fin=ods.filter(o=>o.estado==='finalizada').length;
  const paus=ods.filter(o=>o.estado==='pausada').length;
  const cumpl=tot?Math.round(fin/tot*100):0;
  const c=document.getElementById('cum-c');
  if(!tot&&!comsDia.length){c.innerHTML=`<div class="es"><i class="ti ti-calendar-off"></i>Sin actividad para ${fmtDate(fd)}</div>`;return;}
  c.innerHTML=`
    <div class="sg">
      <div class="sc"><div class="sv" style="color:var(--acc)">${tot}</div><div class="sl">OTs del día</div></div>
      <div class="sc"><div class="sv" style="color:var(--acc3)">${cumpl}%</div><div class="sl">Cumplimiento</div></div>
      <div class="sc"><div class="sv" style="color:var(--acc3)">${fin}</div><div class="sl">Finalizadas</div></div>
      <div class="sc"><div class="sv" style="color:var(--warn)">${paus}</div><div class="sl">Pausadas</div></div>
    </div>
    ${tot?`<div class="card"><div class="ct" style="margin-bottom:.35rem">Avance del día</div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-bottom:.2rem"><span>${fin}/${tot} finalizadas</span><span>${cumpl}%</span></div>
      ${pbw(cumpl)}</div>`:``}
    ${comsDia.length?`<div class="shd"><i class="ti ti-flag"></i> Compromisos del día</div>${comsDia.map(c=>comCard(c)).join('')}`:''}
    ${ods.length?`<div class="shd"><i class="ti ti-list"></i> OTs del día</div>${ods.map(o=>otCard(o,'openPlanDet')).join('')}`:''}`;
}

function getWeekRange(){
  const now=new Date(); now.setHours(0,0,0,0);
  const day=now.getDay(); const diffLun=day===0?-6:1-day;
  const lun=new Date(now); lun.setDate(now.getDate()+diffLun);
  const dom=new Date(lun); dom.setDate(lun.getDate()+6);
  return {lun,lunStr:lun.toISOString().split('T')[0],domStr:dom.toISOString().split('T')[0]};
}

function renderSupSemana(tc){
  const {lun,lunStr,domStr}=getWeekRange();
  const ots=visibleOTs().filter(o=>o.fecha_programada>=lunStr&&o.fecha_programada<=domStr);
  const hoyStr=today();
  const dias=[];
  for(let i=0;i<7;i++){
    const d=new Date(lun); d.setDate(lun.getDate()+i);
    const ds=d.toISOString().split('T')[0];
    dias.push({ds,dOTs:ots.filter(o=>o.fecha_programada===ds),
      nomDia:['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d.getDay()],dNum:d.getDate()});
  }
  const tot=ots.length; const fin=ots.filter(o=>o.estado==='finalizada').length;
  const cumplSem=tot?Math.round(fin/tot*100):0;
  tc.innerHTML=`
    <div style="display:flex;gap:4px;margin-bottom:.75rem;overflow-x:auto">
      ${dias.map(d=>{
        const isHoy=d.ds===hoyStr;
        const hasPaus=d.dOTs.some(o=>o.estado==='pausada');
        const allFin=d.dOTs.length>0&&d.dOTs.every(o=>o.estado==='finalizada');

          <div style="font-size:13px;font-weight:600;color:${isHoy?'#fff':d.dOTs.length?'var(--text)':'var(--text3)'}">${d.dNum}</div>
          ${d.dOTs.length?`<div style="font-size:8px;color:${isHoy?'rgba(255,255,255,.8)':allFin?'var(--acc3)':hasPaus?'var(--warn)':'var(--acc2)'}">${d.dOTs.length}</div>`:`<div style="font-size:8px;color:var(--text3)">—</div>`}

      <div class="sc"><div class="sv" style="color:var(--acc3)">${cumplSem}%</div><div class="sl">Cumplimiento</div></div>

async function actualizarHorasTarea(id_ot, idx, valor){
  const o=S.ots.find(x=>x.id_ot===id_ot);
  const tareas=JSON.parse(o.tareas_json||'[]');
  tareas[idx].horas=parseFloat(valor)||0;
  // Avance = horas programadas de tareas COMPLETADAS / total horas programadas OT
  const horasPorTareaF=o.horas_programadas/tareas.length;
  const horasProgramadasCompletadas=tareas.filter(t=>t.check).reduce((a,t)=>a+(parseFloat(t.horas_prog)||horasPorTareaF),0);
  const avance=o.horas_programadas?Math.min(100,Math.round(horasProgramadasCompletadas/o.horas_programadas*100)):0;
  // Horas ejecutadas = suma real de horas trabajadas
  const horasEjecutadas=tareas.reduce((a,t)=>a+(parseFloat(t.horas)||0),0);
  o.tareas_json=JSON.stringify(tareas);
  o.horas_ejecutadas=horasEjecutadas;
  o.avance_pct=avance;
  await supa.patch('ots',`id_ot=eq.${id_ot}`,{tareas_json:o.tareas_json,horas_ejecutadas:horasEjecutadas,avance_pct:avance});
}

// Fotos por tarea
let _fotosTareasURL={};
let _fotosTareas={};

// Sube foto inmediatamente al seleccionarla
function handleFotoTareaOT(id_ot, idx, inp){
  if(!inp.files||!inp.files[0]) return;
  const statusEl=document.getElementById(`ft-status-${idx}`);
  const btn=inp.parentElement;
  if(statusEl) statusEl.textContent='⏳ Subiendo...';
  if(btn) btn.classList.add('up');
  comprimirImagen(inp.files[0]).then(async comp=>{
    try{
      const o=S.ots.find(x=>x.id_ot===id_ot); const eq=getEq(o.equipo_cod);
      const ts=new Date().toISOString().replace(/[:.]/g,'-');
      const path=`${eq.codigo_interno}/${id_ot}_${o.nombre.replace(/\s+/g,'_')}/tarea${idx}_${ts}.jpg`;
      const url=await uploadConReintento(path,comp);
      _fotosTareasURL[String(idx)]=url;
      if(btn){
        btn.innerHTML=`<input type="file" id="ft-${id_ot}-${idx}" accept="image/*" capture="environment"
          onchange="handleFotoTareaOT('${id_ot}',${idx},this)" style="display:none">
          <i class="ti ti-photo-check"></i> Foto ✓
          <a href="${url}" target="_blank" style="font-size:10px;margin-left:.3rem">ver</a>`;
      }
      if(statusEl){statusEl.textContent='✓ Subida';setTimeout(()=>{statusEl.textContent='';},2000);}
    }catch(e){
      if(btn) btn.classList.remove('up');
      if(statusEl) statusEl.textContent='⚠ Error, intenta de nuevo';
    }
  });
}

// Guardar una tarea individual con horas, nota y foto
async function guardarTarea(id_ot, idx){
  const o=S.ots.find(x=>x.id_ot===id_ot);
  const tareas=JSON.parse(o.tareas_json||'[]');
  const t=tareas[idx];
  // Nota
  const notaEl=document.getElementById(`nota-tarea-${idx}`);
  if(notaEl) t.nota=notaEl.value||'';
  // Foto subida
  if(_fotosTareasURL[String(idx)]) t.foto_tarea_url=_fotosTareasURL[String(idx)];
  // Avance
  const horasPorTarea=o.horas_programadas/tareas.length;
  const horasProgCompletadas=tareas.filter(x=>x.check).reduce((a,x)=>a+(parseFloat(x.horas_prog)||horasPorTarea),0);
  const avance=o.horas_programadas?Math.min(100,Math.round(horasProgCompletadas/o.horas_programadas*100)):0;
  const horasEjecutadas=tareas.reduce((a,x)=>a+(parseFloat(x.horas)||0),0);
  o.tareas_json=JSON.stringify(tareas);
  o.avance_pct=avance; o.horas_ejecutadas=horasEjecutadas;
  try{
    await supa.patch('ots',`id_ot=eq.${id_ot}`,{
      tareas_json:o.tareas_json, avance_pct:avance, horas_ejecutadas:horasEjecutadas,
      estado:o.estado==='sin_iniciar'?'en_ejecucion':o.estado
    });
    const btn=document.querySelector(`button[onclick="guardarTarea('${id_ot}',${idx})"]`);
    if(btn){
      const orig=btn.innerHTML;
      btn.innerHTML='<i class="ti ti-check"></i> ✓ Guardado';
      btn.style.background='rgba(16,185,129,.2)';
      setTimeout(()=>{btn.innerHTML=orig;btn.style.background='';},2000);
    }
  }catch(e){alert('Error al guardar: '+e.message);}
}



async function handleFotoCierre(id_ot,inp){
  if(!inp.files||!inp.files[0]) return;
  const file=inp.files[0];
  const o=S.ots.find(x=>x.id_ot===id_ot); const eq=getEq(o.equipo_cod);
  const path=`${eq.codigo_interno}/${id_ot}_${o.nombre.replace(/\s+/g,'_')}/foto_cierre.jpg`;
  try{
    const url=await supa.upload(path,await comprimirImagen(file));
    o.foto_cierre_url=url;
    await supa.patch('ots',`id_ot=eq.${id_ot}`,{foto_cierre_url:url});
    document.getElementById('pu-cierre').classList.add('ok');
    document.getElementById('pu-cierre').innerHTML=`<input type="file" id="fi-cierre" accept="image/*" capture="environment" onchange="handleFotoCierre('${id_ot}',this)"><i class="ti ti-photo-check" style="font-size:22px;color:var(--acc3);display:block;margin-bottom:.3rem"></i><div class="pu-txt">Foto adjunta ✓</div>`;

  }
}

async function saveAvance(id_ot){
  const o=S.ots.find(x=>x.id_ot===id_ot); const eq=getEq(o.equipo_cod);
  const tareas=JSON.parse(o.tareas_json||'[]');
  // Horas reales ejecutadas (suma de lo que tardaron)
  const horasEjecutadas=tareas.reduce((a,t)=>a+(parseFloat(t.horas)||0),0);
  const horasPorTarea=o.horas_programadas/tareas.length;
  // Avance = horas PROGRAMADAS de tareas completadas / total horas programadas OT
  const horasProgCompletadas=tareas.filter(t=>t.check).reduce((a,t)=>a+(parseFloat(t.horas_prog)||horasPorTarea),0);
  const avance=o.horas_programadas?Math.min(100,Math.round(horasProgCompletadas/o.horas_programadas*100)):0;
  const notas=document.getElementById('nv')?.value||'';

  // Capturar fotos ya subidas y limpiar
  const fotosTareasSubidas={..._fotosTareasURL};
  _fotosTareasURL={};

  // Las fotos ya fueron subidas — solo asignar URLs
  const tareasConFoto=tareas.map((t,i)=>({
    nombre:t.nombre, check:t.check,
    horas:t.horas||0, horas_prog:t.horas_prog||0,
    tecnico:o.tecnico, fecha:today(),
    foto_tarea_url:fotosTareasSubidas[String(i)]||null
  }));

  const reporte={
    ot_id:id_ot, equipo_cod:o.equipo_cod,
    avance_pct:avance, horas_ejecutadas:horasEjecutadas,
    notas, foto_url:null,
    supervisor:S.userName,
    tareas_json:JSON.stringify(tareasConFoto)
  };
  try{await supa.post('reportes_avance',reporte);}catch(e){console.warn('Error reporte',e);}

  let nuevoEstado=o.estado==='sin_iniciar'?'en_ejecucion':
    ['pausada','finalizada'].includes(o.estado)?o.estado:'en_proceso';
  await supa.patch('ots',`id_ot=eq.${id_ot}`,{
    avance_pct:avance, horas_ejecutadas:horasEjecutadas,
    notas, estado:nuevoEstado, tareas_json:o.tareas_json
  });
  o.avance_pct=avance; o.horas_ejecutadas=horasEjecutadas;
  o.notas=notas; o.estado=nuevoEstado;

  // PDF en 2do plano
  generarPDF(id_ot, true).catch(e=>{
    addAlert('warn',`PDF OT ${id_ot}`,`Error: ${e.message||e}`);
  });
  openSupOT(id_ot);
}

async function finOT(id_ot){
  const o=S.ots.find(x=>x.id_ot===id_ot);
  if(!o.foto_cierre_url){alert('Requiere foto de cierre');return;}
  const tareas=JSON.parse(o.tareas_json||'[]');
  const allCheck=tareas.map(t=>({...t,check:true}));
  const horasTotales=allCheck.reduce((a,t)=>a+(parseFloat(t.horas)||0),0);
  await supa.patch('ots',`id_ot=eq.${id_ot}`,{
    estado:'finalizada',avance_pct:100,
    tareas_json:JSON.stringify(allCheck),
    horas_ejecutadas:horasTotales||o.horas_ejecutadas||o.horas_programadas
  });
  o.estado='finalizada'; o.avance_pct=100;
  o.tareas_json=JSON.stringify(allCheck);
  o.horas_ejecutadas=horasTotales||o.horas_ejecutadas||o.horas_programadas;
  // Cerrar inmediatamente
  cm('m-det'); renderRole();
  // PDF en background con delay para no bloquear UI
  setTimeout(()=>{
    generarPDF(id_ot, true).catch(e=>{
      addAlert('warn',`PDF OT ${id_ot}`,`Error: ${e.message||e}`);
    });
  }, 1000);
}

// ===================== PDF REPORT =====================
async function generarPDF(id_ot, silent=false){
  const o=S.ots.find(x=>x.id_ot===id_ot); const eq=getEq(o.equipo_cod);
  const tareas=JSON.parse(o.tareas_json||'[]');
  const tareasBase=tareas; // definir aquí para usar en todo el PDF
  let reportes=[];
  try{reportes=await supa.get('reportes_avance',`ot_id=eq.${id_ot}&order=fecha_reporte.asc`);}catch(e){}
  if(!reportes) reportes=[];

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210; const M=15;
  let y=M;
  const fechaGen=new Date().toLocaleString('es-CL');
  const nombreArchivo=`${o.id_ot}_${o.nombre.replace(/\s+/g,'_')}`;

  // ── Header azul oscuro ──
  doc.setFillColor(30,36,56); doc.rect(0,0,W,38,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(16); doc.setFont(undefined,'bold');
  doc.text('CONSTRUCTORA EXCON S.A.',M,13);
  doc.setFontSize(10); doc.setFont(undefined,'normal'); doc.setTextColor(180,190,220);
  doc.text('Departamento de Maquinaria',M,21);
  doc.setFontSize(9); doc.setTextColor(247,150,70); doc.setFont(undefined,'bold');
  doc.text('REPORTE DE ORDEN DE TRABAJO',M,29);
  doc.setFont(undefined,'normal'); doc.setTextColor(160,170,200); doc.setFontSize(8);
  doc.text(`Generado: ${fechaGen}`,W-M,29,{align:'right'});
  y=44;

  // ── Info OT ──
  doc.setTextColor(30,36,56); doc.setFontSize(14); doc.setFont(undefined,'bold');
  doc.text(`${o.id_ot} — ${o.nombre}`,M,y); y+=8;
  doc.setFontSize(9); doc.setFont(undefined,'normal'); doc.setTextColor(80,80,80);
  doc.text(`Equipo: ${eq.nombre} [${eq.codigo_interno}]`,M,y); y+=5;
  doc.text(`Tecnico: ${o.tecnico} · Sitio: ${o.sucursal}`,M,y); y+=5;
  doc.text(`Fecha programada: ${fmtDate(o.fecha_programada)} · Fecha ejecucion: ${fmtDate(today())} · Estado: ${EC[o.estado]?.lbl||o.estado}`,M,y); y+=5;
  doc.text(`Horas: ${o.horas_ejecutadas||0}h reales / ${o.horas_programadas}h programadas · Avance: ${o.avance_pct||0}%`,M,y); y+=8;

  // Barra progreso
  doc.setFillColor(42,48,72); doc.rect(M,y,W-M*2,4,'F');
  doc.setFillColor(59,130,246); doc.rect(M,y,(W-M*2)*(o.avance_pct||0)/100,4,'F');
  y+=10;

  // ── RESUMEN DE TAREAS ──
  doc.setFontSize(10); doc.setFont(undefined,'bold'); doc.setTextColor(59,130,246);
  doc.text('RESUMEN DE TAREAS',M,y); y+=6;
  doc.setFillColor(245,247,252); doc.rect(M,y-2,W-M*2,tareasBase.length*7+4,'F');
  doc.setDrawColor(200,210,230); doc.rect(M,y-2,W-M*2,tareasBase.length*7+4,'S');
  tareasBase.forEach((t,i)=>{
    const isOK=t.check;
    const hProg=parseFloat(t.horas_prog)||parseFloat(t.horas)||0;
    const hReal=parseFloat(t.horas)||0;
    doc.setFontSize(8); doc.setFont(undefined,isOK?'bold':'normal');
    doc.setTextColor(isOK?34:60, isOK?139:60, isOK?34:60);
    doc.text(`${isOK?'[OK]':'[ ] '} ${i+1}. ${t.nombre}`,M+3,y+4);
    doc.setTextColor(100,100,100); doc.setFont(undefined,'normal');
    doc.text(`${hProg}h prog / ${hReal}h real`,W-M-3,y+4,{align:'right'});
    y+=7;
  });
  y+=8;

  // ── DETALLE DE TAREAS CON HISTORIAL CRONOLÓGICO POR TAREA ──
  doc.setFontSize(10); doc.setFont(undefined,'bold'); doc.setTextColor(59,130,246);
  doc.text('DETALLE DE TAREAS',M,y); y+=7;


  for(let ti=0;ti<tareasBase.length;ti++){
    const tarea=tareasBase[ti];
    if(y>250){doc.addPage();y=M;}

    // Encabezado de tarea
    const isCheck=tarea.check;
    doc.setFillColor(isCheck?59:30, isCheck?130:100, isCheck?246:180);
    doc.rect(M,y-2,W-M*2,9,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont(undefined,'bold');
    const marcaTarea=isCheck?'[OK]':'[ ]';
    doc.text(`${marcaTarea} ${ti+1}. ${tarea.nombre}`,M+2,y+4);
    // Técnico y fecha en encabezado de tarea
    doc.setFont(undefined,'normal'); doc.setFontSize(8); doc.setTextColor(200,220,255);
    const hProgTarea=parseFloat(tarea.horas_prog)||parseFloat(tarea.horas)||0;
    const hRealTarea=parseFloat(tarea.horas)||0;
    doc.text(`${o.tecnico} · ${fmtDate(tarea.fecha||o.fecha_programada)} · ${hProgTarea}h prog / ${hRealTarea}h real`,W-M-2,y+4,{align:'right'});
    y+=11;

    // Leer nota y foto directamente desde tareas_json
    const notaTarea=tarea.nota||'';
    const fotoTarea=tarea.foto_tarea_url||null;

    if(notaTarea||fotoTarea||hRealTarea>0){
      if(y>255){doc.addPage();y=M;}
      doc.setFillColor(248,249,252); doc.rect(M+3,y-1,W-M*2-3,fotoTarea?50:18,'F');
      doc.setTextColor(100,100,100); doc.setFontSize(8); doc.setFont(undefined,'normal');
      doc.text(`${hRealTarea}h reales`,M+5,y+5);
      let yOffset=12;
      if(notaTarea){
        const n=notaTarea.length>85?notaTarea.substring(0,82)+'...':notaTarea;
        doc.text(`Nota: ${n}`,M+5,y+yOffset);
        yOffset+=7;
      }
      if(fotoTarea){
        try{
          const b64=await imgToBase64(fotoTarea);
          if(b64){doc.addImage(b64,'JPEG',M+5,y+yOffset,55,32);yOffset+=34;}
        }catch(e){
          doc.setTextColor(180,180,180);doc.setFontSize(7);
          doc.text('(foto no disponible)',M+5,y+yOffset);yOffset+=6;
        }
      }
      y+=yOffset+2;
    } else {
      doc.setTextColor(160,160,160); doc.setFontSize(8);
      doc.text('Sin reporte registrado',M+5,y+4); y+=10;
    }

    const hayReportes=true; // compatibilidad
    y+=5;
  }

  // ── Foto de Cierre ──
  if(o.foto_cierre_url){
    if(y>200){doc.addPage();y=M;}
    doc.setFontSize(10); doc.setFont(undefined,'bold'); doc.setTextColor(59,130,246);
    doc.text('FOTO DE CIERRE',M,y); y+=6;
    try{
      const b64=await imgToBase64(o.foto_cierre_url);
      if(b64){
        doc.addImage(b64,'JPEG',M,y,80,60);
        y+=65;
      }
    }catch(e){
      doc.setTextColor(150,150,150); doc.setFontSize(8);
      doc.text('(foto no disponible)',M,y); y+=8;
    }
  }

  // ── Footer azul oscuro ──
  const pages=doc.internal.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    doc.setPage(p);
    doc.setFillColor(30,36,56); doc.rect(0,285,W,12,'F');
    doc.setTextColor(150,150,180); doc.setFontSize(7); doc.setFont(undefined,'normal');
    doc.text(`Constructora Excon S.A. · OT ${o.id_ot} · ${eq.nombre} [${eq.codigo_interno}]`,M,292);
    doc.text(`Pag. ${p}/${pages}`,W-M,292,{align:'right'});
  }

  if(silent){
    const pdfBlob=doc.output('blob');
    const pdfFile=new File([pdfBlob],`${nombreArchivo}.pdf`,{type:'application/pdf'});
    const pdfPath=`${eq.codigo_interno}/${nombreArchivo}/${nombreArchivo}.pdf`;
    try{await supa.upload(pdfPath,pdfFile);}catch(e){console.warn('Error subir PDF',e);}
  } else {
    doc.save(`${nombreArchivo}.pdf`);
  }
}

async function saveChecklist(){
  const st=S.evalState; const eq=getEq(st.equipoCod);
  const f4=_fotos4lados;
  if(!f4.front||!f4.post||!f4.der||!f4.izq){alert('Se requieren las 4 fotos del equipo (Frontal, Posterior, Lateral Derecha, Lateral Izquierda)');return;}
  const realItems=st.items.filter(i=>!i.esSeccion);
  const ncs=realItems.filter(i=>['R','M'].includes(i.estado));
  const sinObs=ncs.filter(i=>!i.obs||i.obs.trim()==='');
  if(sinObs.length){alert(`Falta observación en:\n${sinObs.map(i=>`• ${i.name}`).join('\n')}`);return;}
  const idInsp='INSP-'+Date.now();
  // Subir fotos 4 costados
  const urlsFotos={};
  for(const [key,b64] of Object.entries(f4)){
    if(b64){
      try{
        const base64=b64.split(',')[1]; const mime=b64.split(',')[0].split(':')[1].split(';')[0];
        const bytes=atob(base64); const arr=new Uint8Array(bytes.length);
        for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
        const blob=new Blob([arr],{type:mime});
        const file=new File([blob],`${key}.jpg`,{type:mime});
        urlsFotos[key]=await supa.upload(`${eq.codigo_interno}/checklist/${idInsp}_${key}.jpg`,file);
      }catch(e){console.warn(e);}
    }
  }
  // Subir foto serie
  let urlSerie=null;
  if(st.fotoSerie){
    try{
      const base64=st.fotoSerie.split(',')[1]; const mime=st.fotoSerie.split(',')[0].split(':')[1].split(';')[0];
      const bytes=atob(base64); const arr=new Uint8Array(bytes.length);
      for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
      const blob=new Blob([arr],{type:mime});
      const file=new File([blob],'serie.jpg',{type:mime});
      urlSerie=await supa.upload(`${eq.codigo_interno}/checklist/${idInsp}_serie.jpg`,file);
    }catch(e){console.warn(e);}
  }
  // Subir fotos NC
  for(const item of ncs){
    if(item.foto){
      try{
        const base64=item.foto.split(',')[1]; const mime=item.foto.split(',')[0].split(':')[1].split(';')[0];
        const bytes=atob(base64); const arr=new Uint8Array(bytes.length);
        for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
        const blob=new Blob([arr],{type:mime});
        const file=new File([blob],'nc.jpg',{type:mime});
        item.foto_url=await supa.upload(`${eq.codigo_interno}/checklist/${idInsp}_${item.name.replace(/\s+/g,'_').substring(0,20)}.jpg`,file);
      }catch(e){console.warn(e);}
    }
  }
  const conformes=realItems.filter(i=>i.estado==='B').length;
  const insp={
    id_inspeccion:idInsp,equipo_cod:st.equipoCod,sucursal:eq.sucursal||S.userSitio,
    tipo_inspeccion:'Checklist Estándar',inspector:S.userName,
    total_conformes:conformes,total_nc:ncs.length,
    total_na:realItems.filter(i=>i.estado==='NA').length,
    items_json:JSON.stringify({
      datos:{origen:st.origen,destino:st.destino,horometro:st.horometro,combustible:st.combustible},
      fotoSerie:urlSerie,
      docs:st.docs.map((d,i)=>({nombre:['Revisión Técnica','Emisión de Gases','Seguro Obligatorio','Permiso de Circulación'][i],...d})),
      fotos4lados:urlsFotos,
      items:realItems.map(i=>({seccion:i.seccion,nombre:i.name,estado:i.estado,obs:i.obs||'',foto_url:i.foto_url||null}))
    }),
    fotos_nc_json:JSON.stringify(ncs.map(i=>({item:i.name,url:i.foto_url||null,obs:i.obs||''})))
  };
  try{
    const res=await supa.post('inspecciones',insp);
    S.inspecciones.unshift(res[0]);
    // Actualizar req_habilitacion automáticamente
    const reqHab=ncs.length>0?'pendiente':'ok';
    await supa.patch('equipos',`codigo_interno=eq.${st.equipoCod}`,{req_habilitacion:reqHab});
    const eqObj=S.equipos.find(e=>e.codigo_interno===st.equipoCod);
    if(eqObj) eqObj.req_habilitacion=reqHab;
    if(ncs.length>0) addAlert('warn',`Checklist ${getEq(st.equipoCod).nombre}`,`${ncs.length} NC en habilitación — req. pendiente`);
    _fotos4lados={der:null,izq:null,front:null,post:null};
    cm('m-eval'); renderRole();
    alert(`✓ Checklist guardado\n✓ ${conformes} OK · ✗ ${ncs.length} NC\n\nReq. habilitación: ${reqHab==='ok'?'✅ OK':'⚠ Pendiente NC'}`);
  }catch(e){alert('Error: '+e.message);}
}

  if(sinFoto.length){alert(`Falta foto en posición(es): ${sinFoto.map(n=>n.pos).join(', ')}`);return;}
  const sinEstado=_neum.neumaticos.filter(n=>!n.estado);
  if(sinEstado.length){alert(`Falta estado en posición(es): ${sinEstado.map(n=>n.pos).join(', ')}`);return;}
  const eq=getEq(_neum.equipoCod);
  const idInsp='INSP-'+Date.now();
  // Subir fotos
  for(const n of _neum.neumaticos){
    if(n.foto){
      try{
        const base64=n.foto.split(',')[1]; const mime=n.foto.split(',')[0].split(':')[1].split(';')[0];
        const bytes=atob(base64); const arr=new Uint8Array(bytes.length);
        for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
        const blob=new Blob([arr],{type:mime});
        const file=new File([blob],`pos${n.pos}.jpg`,{type:mime});
        n.foto_url=await supa.upload(`${eq.codigo_interno}/neumaticos/${idInsp}_pos${n.pos}.jpg`,file);
      }catch(e){console.warn(e);}
    }
  }
  const buenos=_neum.neumaticos.filter(n=>n.estado==='B').length;
  const malos=_neum.neumaticos.filter(n=>n.estado==='M').length;
  const obs=document.getElementById('neum-obs')?.value||'';
  const insp={
    id_inspeccion:idInsp,equipo_cod:_neum.equipoCod,sucursal:eq.sucursal||S.userSitio,
    tipo_inspeccion:'Levantamiento Neumáticos',inspector:S.userName,
    total_conformes:buenos,total_nc:malos,total_na:0,
    items_json:JSON.stringify(_neum.neumaticos.map(n=>({...n,foto:null}))),
    fotos_nc_json:JSON.stringify(_neum.neumaticos.filter(n=>n.estado==='M').map(n=>({item:`Pos ${n.pos}`,url:n.foto_url||null,obs:''})))
  };
  try{
    const res=await supa.post('inspecciones',insp);
    S.inspecciones.unshift(res[0]);
    if(malos>0) addAlert('crit',`Neumáticos ${eq.nombre}`,`${malos} en mal estado`);
    cm('m-eval'); renderRole();
    alert(`✓ Levantamiento guardado\n${buenos} buenos · ${malos} malos`);
  }catch(e){alert('Error: '+e.message);}
}

function startEval(tipoEq, tipoInsp, etiqueta){
  const cod=document.getElementById('ev-eq').value;
  const horometro=document.getElementById('ev-horometro').value||'';
  const plantillas=S.plantillas.filter(p=>p.tipo_equipo===tipoEq&&p.tipo_inspeccion===(tipoInsp||'AT1'));
  if(!plantillas.length){alert(`No hay plantilla para "${tipoEq}".`);return;}
  const secciones={};
  plantillas.forEach(p=>{const sec=p.seccion||'General';if(!secciones[sec])secciones[sec]=[];
    secciones[sec].push({name:p.item_inspeccion,tipo_resp:'BRM',estado:null,foto:null,obs:'',seccion:sec});});
  const items=[];
  Object.entries(secciones).forEach(([sec,its])=>{items.push({esSeccion:true,name:sec});its.forEach(it=>items.push(it));});
  S.evalState={tipoEq:etiqueta||tipoEq,tipoPlantilla:tipoEq,tipoInsp:tipoInsp||'AT1',equipoCod:cod,horometro,items,ts:new Date().toISOString(),
    totalItems:items.filter(i=>!i.esSeccion).length};
  renderEvalForm();
}

function setEI(i,v){
  if(S.evalState&&S.evalState.items&&S.evalState.items[i]){
    S.evalState.items[i].estado=v;
    if(!['R','M'].includes(v)){S.evalState.items[i].foto=null;S.evalState.items[i].obs='';}
    renderEvalForm();
    setTimeout(()=>{const el=document.getElementById(`ei-${i}`);if(el)el.scrollIntoView({block:'nearest'});},50);
  }
}
function handleEF(i,inp){
  if(!inp.files||!inp.files[0]) return;
  comprimirImagen(inp.files[0]).then(comp=>{
    const r=new FileReader();
    r.onload=e=>{S.evalState.items[i].foto=e.target.result;renderEvalForm();};
    r.readAsDataURL(comp);
  });
}

async function saveEval(){
  const st=S.evalState; const eq=getEq(st.equipoCod);
  const realItems=st.items.filter(i=>!i.esSeccion);
  const ncs=realItems.filter(i=>['R','M'].includes(i.estado));
  const sinObs=ncs.filter(i=>!i.obs||i.obs.trim()==='');
  if(sinObs.length){alert(`Falta observación en:\n${sinObs.map(i=>`• ${i.name}`).join('\n')}`);return;}
  const sinFoto=ncs.filter(i=>!i.foto);
  if(sinFoto.length){alert(`Falta foto en:\n${sinFoto.map(i=>`• ${i.name}`).join('\n')}`);return;}
  const idInsp='INSP-'+Date.now();
  const fotosFallidas=[];
  for(const item of ncs){
    if(item.foto){
      try{
        const base64=item.foto.split(',')[1]; const mime=item.foto.split(',')[0].split(':')[1].split(';')[0];
        const bytes=atob(base64); const arr=new Uint8Array(bytes.length);
        for(let k=0;k<bytes.length;k++) arr[k]=bytes.charCodeAt(k);
        const blob=new Blob([arr],{type:mime});
        const file=new File([blob],'nc.jpg',{type:mime});
        const comp=await comprimirImagen(file);
        const path=`${eq.codigo_interno}/inspecciones/${idInsp}_${item.name.replace(/\s+/g,'_').substring(0,25)}.jpg`;
        // Intentar hasta 3 veces con reintento automático
        let url=null;
        try{url=await uploadConReintento(path,comp);}
        catch(e){fotosFallidas.push(item.name);}
        item.foto_url=url;
      }catch(e){fotosFallidas.push(item.name);}
    }
  }
  if(fotosFallidas.length){
    addAlert('warn','Fotos NC no subidas',`Fallaron: ${fotosFallidas.join(', ')}. Se guardó la inspección sin esas fotos.`);
  }
  const conformes=realItems.filter(i=>i.estado==='B').length;
  const inspData={
    id_inspeccion:idInsp,equipo_cod:st.equipoCod,sucursal:eq.sucursal||S.userSitio,
    tipo_inspeccion:`${st.tipoInsp} ${st.tipoEq}`,inspector:S.userName,
    total_conformes:conformes,total_nc:ncs.length,
    total_na:realItems.filter(i=>i.estado==='NA').length,
    items_json:JSON.stringify(realItems.map(i=>({seccion:i.seccion,nombre:i.name,estado:i.estado,obs:i.obs||'',foto_url:i.foto_url||null}))),
    fotos_nc_json:JSON.stringify(ncs.map(i=>({item:i.name,url:i.foto_url||null,obs:i.obs||''})))
  };
  try{
    const res=await supa.post('inspecciones',inspData);
    S.inspecciones.unshift(res[0]);
    // Actualizar req_mecanica del equipo automáticamente
    const reqMec=ncs.length>0?'pendiente':'ok';
    await supa.patch('equipos',`codigo_interno=eq.${st.equipoCod}`,{req_mecanica:reqMec});
    const eqObj=S.equipos.find(e=>e.codigo_interno===st.equipoCod);
    if(eqObj) eqObj.req_mecanica=reqMec;
    // Alertar si hay NC
    if(ncs.length>0){
      addAlert('crit',`${st.tipoInsp} ${eq.nombre}`,`${ncs.length} no conforme(s) — req. mecánica pendiente`);
    } else {
      addAlert('info',`${st.tipoInsp} ${eq.nombre}`,'Evaluación mecánica OK');
    }
    generarPDFInspeccion(idInsp,eq,st,realItems,ncs,inspData).catch(e=>console.warn('PDF insp error:',e));
    cm('m-eval'); renderRole();
    alert(`✓ Inspección guardada\n✓ ${conformes} Bueno · ✗ ${ncs.length} NC · ${inspData.total_na} NA${fotosFallidas.length?`\n⚠ ${fotosFallidas.length} foto(s) no subidas`:''}\n\nReq. mecánica: ${reqMec==='ok'?'✅ OK':'⚠ Pendiente NC'}`);
  }catch(e){alert('Error: '+e.message);}
}


// Upload con hasta 3 reintentos automáticos
async function uploadConReintento(path, file, intentos=3){
  for(let i=0;i<intentos;i++){
    try{ return await supa.upload(path,file); }
    catch(e){
      if(i===intentos-1) throw e;
      await new Promise(r=>setTimeout(r,1500*(i+1))); // espera 1.5s, 3s
    }
  }
}

// Comprimir imagen antes de subir (máx 1200px, calidad 0.75)
async function comprimirImagen(file, maxPx=1200, calidad=0.75){
  return new Promise(res=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.width, h=img.height;
      if(w>maxPx||h>maxPx){
        if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}
        else{w=Math.round(w*maxPx/h);h=maxPx;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        res(new File([blob],file.name,{type:'image/jpeg'}));
      },'image/jpeg',calidad);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(file);}; // si falla, usar original
    img.src=url;
  });
}
async function imgToBase64(url){
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),8000); // 8 segundos máximo
    const r=await fetch(url,{signal:controller.signal});
    clearTimeout(timeout);
    const blob=await r.blob();
    return new Promise((res,rej)=>{
      const rd=new FileReader();
      rd.onload=()=>res(rd.result);
      rd.onerror=()=>res(null); // no fallar si hay error
      rd.readAsDataURL(blob);
    });
  }catch(e){
    console.warn('imgToBase64 error:',e);
    return null; // retornar null en vez de fallar
  }
}

async function generarPDFInspeccion(idInsp, eq, st, realItems, ncs, inspData){

  const naTot=realItems.filter(i=>i.estado==='NA').length;

  doc.setTextColor(255,255,255); doc.setFontSize(10); doc.setFont(undefined,'bold');
  doc.text('RESUMEN DE INSPECCIÓN',M+3,y+4);
  y+=8;
  doc.setFillColor(250,250,250); doc.rect(M,y,W-M*2,18,'F');
  doc.setDrawColor(230,230,230); doc.rect(M,y,W-M*2,18,'S');
  doc.setTextColor(40,40,40); doc.setFontSize(9); doc.setFont(undefined,'normal');
  doc.text(`Total ítems evaluados: ${tot}`,M+3,y+6);
  doc.setTextColor(34,139,34); doc.text(`Buenos (B): ${buenos}`,M+3,y+12);
  doc.setTextColor(192,0,0); doc.text(`No Conformes (R/M): ${ncTot}`,M+55,y+12);
  doc.setTextColor(100,100,100); doc.text(`N/A: ${naTot}`,M+115,y+12);
  doc.setTextColor(247,150,70); doc.setFont(undefined,'bold'); doc.setFontSize(11);
  doc.text(`${pct}% Cumplimiento`,W-M-2,y+12,{align:'right'});

      doc.setTextColor(isNC?192:isOK?55:100, isNC?0:isOK?86:100, isNC?0:isOK?35:100);
      doc.setFontSize(8); doc.setFont(undefined,isNC?'bold':'normal');
      const nom=((item.nombre||item.name||'').substring(0,70));
      doc.text(nom,M+2,y+3);
      doc.setFont(undefined,'bold');
      doc.text(item.estado||'—',W-M-3,y+3,{align:'right'});
      y+=7;
      if(isNC){
        // Observación
        if(item.obs||item.observacion){
          if(y>275){doc.addPage();y=M;}
          doc.setFillColor(255,240,240); doc.rect(M+4,y-1,W-M*2-4,6,'F');
          doc.setTextColor(150,0,0); doc.setFont(undefined,'italic'); doc.setFontSize(7);
          const obsText=(item.obs||item.observacion||'').substring(0,90);
          doc.text(`  → ${obsText}`,M+4,y+3);
          y+=7;
        }
        // Foto del ítem NC incrustada
        if(item.foto_url){
          if(y>240){doc.addPage();y=M;}
          try{
            const b64=await imgToBase64(item.foto_url);
            if(b64){
              doc.addImage(b64,'JPEG',M+4,y,55,35);
              y+=38;
            }
          }catch(e){}
        }
      }
    }
    y+=3;
  }

  // ── Footer ──
  const pages=doc.internal.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    doc.setPage(p);
    doc.setFillColor(247,150,70); doc.rect(0,287,W,2,'F');
    doc.setFillColor(255,255,255); doc.rect(0,289,W,8,'F');
    doc.setTextColor(150,150,150); doc.setFontSize(7); doc.setFont(undefined,'normal');
    doc.text(`Constructora Excon S.A. · ${idInsp} · ${eq.nombre} [${eq.codigo_interno}]`,M,294);
    doc.text(`Pág. ${p}/${pages}`,W-M,294,{align:'right'});
  }

  // Subir PDF
  try{
    const pdfBlob=doc.output('blob');
    const pdfFile=new File([pdfBlob],'inspeccion.pdf',{type:'application/pdf'});
    const fechaISO=new Date().toISOString().split('T')[0];
    const path=`${eq.codigo_interno}/inspecciones/${idInsp}_${(st.tipoEq||'insp').replace(/\s+/g,'_')}_${fechaISO}.pdf`;
    await supa.upload(path,pdfFile);
  }catch(e){console.warn('Error subiendo PDF:',e);}
}

function comCard(c){
  const eq=getEq(c.equipo_cod);
  const hoy=today();
  const diff=Math.round((new Date(c.fecha_limite+'T12:00:00')-new Date(hoy+'T12:00:00'))/(86400000));
  const vencido=c.estado!=='Entregado'&&diff<0;
  const venceHoy=c.estado!=='Entregado'&&diff===0;
  const cumplido=c.estado==='Entregado';
  const borderCol=cumplido?'rgba(16,185,129,.3)':vencido?'rgba(239,68,68,.4)':venceHoy?'rgba(245,158,11,.5)':'var(--border)';
  const statusTxt=cumplido?'✓ Entregado':vencido?`⚠ ${Math.abs(diff)}d atrasado`:venceHoy?'⚠ Vence HOY':`Faltan ${diff}d`;
  const statusCol=cumplido?'var(--acc3)':vencido?'var(--danger)':venceHoy?'var(--acc)':'var(--text2)';
  return `<div class="comcard" style="border-color:${borderCol}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.35rem">
      <div><div class="ct" style="font-size:13px">${eq.nombre}</div><div style="font-size:10px;color:var(--text3)">${eq.codigo_interno}</div></div>
      <div style="text-align:right"><div style="font-size:11px;font-weight:600;color:${statusCol}">${statusTxt}</div><div style="font-size:10px;color:var(--text2);font-family:var(--fm)">${fmtDate(c.fecha_limite)}</div></div>
    </div>
    <div style="background:var(--bg3);border-radius:6px;padding:.4rem .6rem;margin-bottom:.35rem">
      <div style="font-size:10px;color:var(--text2);margin-bottom:.15rem">Fecha límite entrega al taller</div>
      <div style="font-size:12px"><i class="ti ti-flag" style="font-size:11px;color:var(--acc)"></i> ${c.objetivo}</div>
      <div style="font-size:11px;color:var(--text2);margin-top:.15rem"><i class="ti ti-map-pin" style="font-size:10px"></i> ${c.destino_envio}</div>
    </div>
    ${!cumplido?`<button class="btn bs bsm" onclick="markEntregado('${c.id_compromiso}')"><i class="ti ti-check"></i> Marcar entregado</button>`:
    `<div style="font-size:11px;color:var(--acc3)"><i class="ti ti-circle-check"></i> Entregado</div>`}

}

// ── Week helpers ──
function getNextWeekRange(){
  const {domStr}=getWeekRange();
  const nextLun=new Date(domStr+'T12:00:00'); nextLun.setDate(nextLun.getDate()+1);
  const nextDom=new Date(nextLun); nextDom.setDate(nextLun.getDate()+6);
  return {nextLunStr:nextLun.toISOString().split('T')[0], nextDomStr:nextDom.toISOString().split('T')[0]};
}

function renderJefeDash(tc){
  const ots=visibleOTs();
  const tot=ots.length; const fin=ots.filter(o=>o.estado==='finalizada').length;
  const paus=ots.filter(o=>o.estado==='pausada').length;
  const cumpl=tot?Math.round(fin/tot*100):0;
  const hoy=today();
  const {lunStr,domStr}=getWeekRange();
  const {nextLunStr,nextDomStr}=getNextWeekRange();
  const atras=ots.filter(o=>o.estado!=='finalizada'&&o.fecha_programada<hoy);

  function dashKPIs(eqList, comList){
    const proceso=eqList.filter(e=>(e.estado_equipo||'En Proceso')==='En Proceso').length;
    const disp=eqList.filter(e=>e.estado_equipo==='Disponible').length;
    const ruta=eqList.filter(e=>e.estado_equipo==='En Ruta').length;
    const codsConCom=new Set(comList.filter(c=>c.estado!=='Entregado').map(c=>c.equipo_cod));
    // Atrasados = En Proceso con fecha vencida
    const atrasados=comList.filter(c=>{
      if(c.estado==='Entregado') return false;
      const eq=getEq(c.equipo_cod);
      return c.fecha_limite<hoy&&(eq?.estado_equipo||'En Proceso')==='En Proceso';
    }).length;
    // Compromiso vigente = En Proceso con fecha futura
    const conFecha=comList.filter(c=>{
      if(c.estado==='Entregado') return false;
      const eq=getEq(c.equipo_cod);
      return c.fecha_limite>=hoy&&(eq?.estado_equipo||'En Proceso')==='En Proceso';
    }).length;
    // Sin fecha = En Proceso sin compromiso asignado
    const eqEnProceso=eqList.filter(e=>(e.estado_equipo||'En Proceso')==='En Proceso');
    const sinFecha=eqEnProceso.filter(e=>!codsConCom.has(e.codigo_interno)).length;
    // Entregados esta semana = fecha_entrega_real dentro de la semana
    const entSemana=comList.filter(c=>c.estado==='Entregado'&&c.fecha_entrega_real>=lunStr&&c.fecha_entrega_real<=domStr).length;
    const comsSem=comList.filter(c=>c.estado!=='Entregado');
    const metaSem=comsSem.filter(c=>c.fecha_limite>=lunStr&&c.fecha_limite<=domStr).length;
    const proxSem=comsSem.filter(c=>c.fecha_limite>=nextLunStr&&c.fecha_limite<=nextDomStr).length;
    return {proceso,disp,ruta,atrasados,conFecha,sinFecha,entSemana,metaSem,proxSem};
  }

  const eqVis=visibleEquipos();
  const comsVis=visibleCompromisos();
  const kTodos=dashKPIs(eqVis,comsVis);

  // Por área
  const areaData={};
  AREAS.forEach(a=>{
    const eqA=S.equipos.filter(e=>e.area===a&&(S.role==='admin'||e.sucursal===S.userSitio));
    const comA=S.compromisos.filter(c=>{const eq=S.equipos.find(e=>e.codigo_interno===c.equipo_cod);return eq&&eq.area===a&&(S.role==='admin'||eq.sucursal===S.userSitio);});
    areaData[a]=dashKPIs(eqA,comA);
    areaData[a].total=eqA.length;
  });

  // Por sitio
  const sitios=['Lo Pinto','La Negra'];
  const sitioData=sitios.map(s=>{
    const eqS=eqVis.filter(e=>e.sucursal===s);
    const comS=comsVis.filter(c=>{const eq=getEq(c.equipo_cod);return eq?.sucursal===s;});
    const k=dashKPIs(eqS,comS);
    return {...k,nombre:s,total:eqS.length};
  });

  function tablaKPI(k){
    const sitioFiltro=k.nombre||'todos';

      <tr>
        <td style="border:1px solid var(--border);padding:7px 6px;text-align:center;cursor:pointer" onclick="verListaEquipos('conFecha','${sitioFiltro}')">
          <div style="font-size:9px;color:var(--acc3);text-transform:uppercase;letter-spacing:.3px">Comp. vigente</div>
          <div style="font-size:16px;font-weight:500;color:var(--acc3);font-family:var(--fm)">${k.conFecha}</div>
        </td>
        <td style="border:1px solid var(--border);padding:7px 6px;text-align:center;background:rgba(239,68,68,.06);cursor:pointer" onclick="verListaEquipos('atrasados','${sitioFiltro}')">

        </td>

          <div style="font-size:9px;color:#ef9f27;text-transform:uppercase;letter-spacing:.3px">Sin fecha comprometida</div>
          <div style="font-size:16px;font-weight:500;color:#ef9f27;font-family:var(--fm)">${k.sinFecha}</div>
        </td>
      </tr>
      <!-- Fila 4: compromisos -->

          <div style="font-size:16px;font-weight:500;color:var(--acc2);font-family:var(--fm)">${k.metaSem}</div>
        </td>
        <td colspan="2" style="border:1px solid var(--border);padding:8px 10px;text-align:center;background:var(--bg3)">
          <div style="font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px">Compromisos próx. semana</div>
          <div style="font-size:16px;font-weight:500;color:var(--text2);font-family:var(--fm)">${k.proxSem}</div>
        </td>
      </tr>
    </table>`;
  }

  // Tabs de área
  const areaTab=S.dashArea||'todos';
  const eqBase=areaTab==='todos'?eqVis:S.equipos.filter(e=>e.area===areaTab&&(S.role==='admin'||e.sucursal===S.userSitio));

  const kActual=areaTab==='todos'?kTodos:dashKPIs(eqBase,comBase);
  kActual.total=eqBase.length;

  kActual.faltaMec=eqBase.filter(e=>(e.estado_equipo||'En Proceso')==='En Proceso'&&e.area!=='Repex'&&!e.req_mecanica).length;
  kActual.faltaHab=eqBase.filter(e=>(e.estado_equipo||'En Proceso')==='En Proceso'&&e.area==='Habilitación'&&!e.req_habilitacion).length;
  const sitioActual=sitios.map(s=>{

    <!-- POR SITIO -->
    ${sitioActual.filter(s=>s.total>0).map(s=>`
    <div style="font-size:10px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:5px 10px;background:var(--bg3);border-radius:8px;margin-bottom:8px">

    ${kActual.atrasados>0?`
    <div style="font-size:10px;font-weight:500;color:var(--danger);text-transform:uppercase;letter-spacing:.5px;padding:5px 10px;background:rgba(239,68,68,.08);border-radius:8px;margin-bottom:8px"><i class="ti ti-alert-triangle"></i> Detalle de atrasados</div>
    ${(()=>{
      const atrasadosList=comBase.filter(c=>{
        if(c.estado==='Entregado') return false;
        const eq=getEq(c.equipo_cod);

      const porMes={};
      atrasadosList.forEach(c=>{const m=c.fecha_limite?.substring(0,7)||'?';if(!porMes[m])porMes[m]=[];porMes[m].push(c);});

          ${lista.map(c=>{

    <!-- EVALUACIONES PENDIENTES -->

        <div style="font-size:10px;font-weight:500;color:${kActual.faltaMec>0?'var(--danger)':'var(--text2)'};text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px"><i class="ti ti-tool"></i> Falta eval. mecánica</div>
        <div style="font-size:28px;font-weight:500;color:${kActual.faltaMec>0?'var(--danger)':'var(--acc3)'};font-family:var(--fm)">${kActual.faltaMec}</div>
        <div style="font-size:10px;color:var(--text2);margin-top:2px">equipos sin evaluar</div>
      </div>
      <div style="border:1.5px solid ${kActual.faltaHab>0?'var(--danger)':'var(--acc3)'};border-radius:10px;padding:10px 12px;background:${kActual.faltaHab>0?'rgba(239,68,68,.05)':'transparent'}">
        <div style="font-size:10px;font-weight:500;color:${kActual.faltaHab>0?'var(--danger)':'var(--text2)'};text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px"><i class="ti ti-clipboard-list"></i> Falta checklist hab.</div>
        <div style="font-size:28px;font-weight:500;color:${kActual.faltaHab>0?'var(--danger)':'var(--acc3)'};font-family:var(--fm)">${kActual.faltaHab}</div>
        <div style="font-size:10px;color:var(--text2);margin-top:2px">equipos sin checklist</div>
      </div>
    </div>

    <!-- OTs ESTA SEMANA -->
    ${(()=>{
      const otsSem=visibleOTs().filter(o=>o.fecha_programada>=lunStr&&o.fecha_programada<=domStr);
      const finSem=otsSem.filter(o=>o.estado==='finalizada').length;
      const enCursoSem=otsSem.filter(o=>['en_ejecucion','en_proceso'].includes(o.estado)).length;
      const pausSem=otsSem.filter(o=>o.estado==='pausada').length;
      const cumplSem=otsSem.length?Math.round(finSem/otsSem.length*100):0;
      const atrasSem=otsSem.filter(o=>o.estado!=='finalizada'&&o.fecha_programada<hoy);
      if(!otsSem.length) return '';
      return `<div class="shd"><i class="ti ti-clipboard-list"></i> OTs esta semana</div>
      <div class="sg">
        <div class="sc"><div class="sv" style="color:var(--acc)">${otsSem.length}</div><div class="sl">Total</div></div>
        <div class="sc"><div class="sv" style="color:var(--acc3)">${cumplSem}%</div><div class="sl">Cumplimiento</div></div>
        <div class="sc"><div class="sv" style="color:var(--acc2)">${enCursoSem}</div><div class="sl">En Curso</div></div>
        <div class="sc"><div class="sv" style="color:var(--warn)">${pausSem}</div><div class="sl">Pausadas</div></div>
      </div>
      ${atrasSem.length?`<div class="card" style="border-color:rgba(239,68,68,.2)">
        <div class="ct" style="color:var(--danger);margin-bottom:.35rem"><i class="ti ti-clock-off"></i> OTs Atrasadas (${atrasSem.length})</div>
        ${atrasSem.map(o=>`<div style="font-size:12px;padding:.25rem 0;border-bottom:1px solid var(--border)">${o.id_ot} · ${o.nombre} · ${fmtDate(o.fecha_programada)}</div>`).join('')}
      </div>`:''}
      <div class="card">
        <div class="ct" style="margin-bottom:.5rem">Por Técnico</div>
        ${[...new Set(otsSem.map(o=>o.tecnico))].map(t=>{
          const to=otsSem.filter(o=>o.tecnico===t);
          const tf=to.filter(o=>o.estado==='finalizada').length;
          const tp=Math.round(tf/to.length*100);
          return `<div style="margin-bottom:.55rem"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:.2rem"><span>${t}</span><span style="font-family:var(--fm);color:var(--text2);font-size:11px">${tf}/${to.length}</span></div>${pbw(tp)}</div>`;
        }).join('')||'<div style="font-size:12px;color:var(--text2)">Sin datos</div>'}
      </div>`;
    })()}`;
}

  const hoy=today();
  const {lunStr,domStr}=getWeekRange();

  tc.innerHTML=`
    <!-- BUSCADOR -->
    <div style="position:relative;margin-bottom:.65rem">
      <i class="ti ti-search" style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px"></i>
      <input class="fi" id="eq-search" placeholder="Buscar por código o nombre..."
        oninput="filterEquipos()" style="padding-left:2.4rem;font-size:13px">
    </div>
    <!-- FILTROS -->
    <div style="display:flex;gap:.35rem;margin-bottom:.65rem;flex-wrap:wrap">
      <button class="btn bg bsm ${!S.eqFiltro||S.eqFiltro===''?'bp':''}" onclick="S.eqFiltro='';renderRole()">Todos (${eqs.length})</button>
      <button class="btn bg bsm" style="${S.eqFiltro==='En Proceso'?'background:var(--acc2);color:#fff':''}" onclick="S.eqFiltro='En Proceso';renderRole()">En Proceso (${eqs.filter(e=>(e.estado_equipo||'En Proceso')==='En Proceso').length})</button>
      <button class="btn bg bsm" style="${S.eqFiltro==='Disponible'?'background:var(--acc3);color:#fff':''}" onclick="S.eqFiltro='Disponible';renderRole()">Disponibles (${eqs.filter(e=>e.estado_equipo==='Disponible').length})</button>
      <button class="btn bg bsm" style="${S.eqFiltro==='atrasado'?'background:var(--danger);color:#fff':''}" onclick="S.eqFiltro='atrasado';renderRole()">Atrasados</button>
      <button class="btn bg bsm" style="${S.eqFiltro==='semana'?'background:var(--acc);color:#1a1d26':''}" onclick="S.eqFiltro='semana';renderRole()">Esta semana</button>
    </div>
    <div id="EQL">${buildEqList(eqs, hoy, lunStr, domStr)}</div>`;
}

function filterEquipos(){
  const q=(document.getElementById('eq-search').value||'').toLowerCase();
  const hoy=today();
  const {lunStr,domStr}=getWeekRange();
  let eqs=visibleEquipos();
  if(q) eqs=eqs.filter(e=>
    e.codigo_interno.toLowerCase().includes(q)||
    e.nombre.toLowerCase().includes(q)||
    (e.tipo||'').toLowerCase().includes(q)||
    (e.marca||'').toLowerCase().includes(q)||
    (e.modelo||'').toLowerCase().includes(q)||
    (e.ubicacion||'').toLowerCase().includes(q)
  );
  document.getElementById('EQL').innerHTML=buildEqList(eqs, hoy, lunStr, domStr);
}

function buildEqList(eqs, hoy, lunStr, domStr){
  const coms=S.compromisos;
  let filtered=eqs;
  if(S.eqFiltro==='En Proceso') filtered=eqs.filter(e=>(e.estado_equipo||'En Proceso')==='En Proceso');
  else if(S.eqFiltro==='Disponible') filtered=eqs.filter(e=>e.estado_equipo==='Disponible');
  else if(S.eqFiltro==='atrasado') filtered=eqs.filter(e=>{
    const c=coms.find(c=>c.equipo_cod===e.codigo_interno&&c.estado!=='Entregado');
    return c&&c.fecha_limite<hoy;
  });
  else if(S.eqFiltro==='semana') filtered=eqs.filter(e=>{
    const c=coms.find(c=>c.equipo_cod===e.codigo_interno&&c.estado!=='Entregado');
    return c&&c.fecha_limite>=lunStr&&c.fecha_limite<=domStr;
  });

  if(!filtered.length) return `<div class="es"><i class="ti ti-tractor"></i>Sin equipos en esta categoría</div>`;

  return filtered.map(e=>{
    const com=coms.find(c=>c.equipo_cod===e.codigo_interno&&c.estado!=='Entregado');
    const est=e.estado_equipo||'En Proceso';
    let fechaCol='var(--text2)', fechaTxt='', fechaBorder='var(--border)';
    if(com){
      const diff=Math.round((new Date(com.fecha_limite+'T12:00:00')-new Date(hoy+'T12:00:00'))/(86400000));
      fechaTxt=diff<0?`⚠ ${Math.abs(diff)}d atraso`:diff===0?'Hoy':`${diff}d`;
      fechaCol=diff<0?'var(--danger)':diff<=3?'var(--acc)':'var(--acc3)';
      fechaBorder=diff<0?'rgba(239,68,68,.3)':diff<=7?'rgba(245,158,11,.25)':'var(--border)';
    }
    return `<div class="eqcard" style="border-color:${fechaBorder};align-items:flex-start" onclick="openEqDetail('${e.codigo_interno}')">
      <div class="eqinitials" style="margin-top:.2rem">${e.codigo_interno.substring(0,4)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:500;font-size:13px">${e.nombre}</div>
        <div style="font-size:11px;color:var(--text2)">${e.marca} ${e.modelo}</div>
        <div style="display:flex;gap:.35rem;margin-top:.25rem;flex-wrap:wrap;align-items:center">
          ${eqEstadoBadge(est)}
          ${areaBadge(e.area)}
          <span style="font-size:9px;padding:1px 6px;border-radius:10px;background:rgba(139,92,246,.1);color:#c4b5fd;border:1px solid rgba(139,92,246,.25);font-family:var(--fm)">${e.sucursal}</span>
          ${com?`<span style="font-size:10px;color:${fechaCol};font-weight:500">${fmtDate(com.fecha_limite)} · ${fechaTxt}</span>`:''}
        </div>
        ${com?`<div style="font-size:10px;color:var(--text3);margin-top:.15rem"><i class="ti ti-map-pin" style="font-size:10px"></i> ${com.destino_envio}</div>`:''}
      </div>
      <i class="ti ti-chevron-right" style="color:var(--text3);margin-top:.2rem"></i>
    </div>`;
  }).join('');
}

async function cambiarEstadoEquipo(cod, nuevoEstado){
  try{
    await supa.patch('equipos',`codigo_interno=eq.${cod}`,{estado_equipo:nuevoEstado});
    const eq=S.equipos.find(e=>e.codigo_interno===cod);
    if(eq) eq.estado_equipo=nuevoEstado;
    // Registrar fecha automáticamente en el compromiso activo
    const hoy=today();
    const com=S.compromisos.find(c=>c.equipo_cod===cod&&c.estado!=='Entregado');
    if(com){
      if(nuevoEstado==='Disponible'){
        await supa.patch('compromisos',`id_compromiso=eq.${com.id_compromiso}`,{fecha_disponible:hoy});
        com.fecha_disponible=hoy;
      } else if(nuevoEstado==='En Ruta'){
        await supa.patch('compromisos',`id_compromiso=eq.${com.id_compromiso}`,{fecha_en_ruta:hoy});
        com.fecha_en_ruta=hoy;
      } else if(nuevoEstado==='Entregado'){
        await supa.patch('compromisos',`id_compromiso=eq.${com.id_compromiso}`,{fecha_entrega_real:hoy,estado:'Entregado'});
        com.fecha_entrega_real=hoy; com.estado='Entregado';
      }
    }
    openEqDetail(cod);
  }catch(e){alert('Error: '+e.message);}
}

function verListaEquipos(filtro, sitio){
  const hoy=today();
  const {lunStr,domStr}=getWeekRange();
  let eqs=S.equipos;
  // Filtrar por sitio
  if(sitio&&sitio!=='todos') eqs=eqs.filter(e=>e.sucursal===sitio);
  // Filtrar por área activa
  const area=S.dashArea||S.areaFiltro||'todos';
  if(area!=='todos') eqs=eqs.filter(e=>e.area===area);
  // Filtrar por estado
  let titulo='Todos los equipos';
  let lista=[];
  if(filtro==='todos'){
    lista=eqs; titulo='Todos los equipos';
  } else if(filtro==='En Proceso'){
    lista=eqs.filter(e=>(e.estado_equipo||'En Proceso')==='En Proceso');
    titulo='En Proceso';
  } else if(filtro==='Disponible'){
    lista=eqs.filter(e=>e.estado_equipo==='Disponible');
    titulo='Disponibles';
  } else if(filtro==='En Ruta'){
    lista=eqs.filter(e=>e.estado_equipo==='En Ruta');
    titulo='En Ruta';
  } else if(filtro==='entregados_sem'){
    const coms=S.compromisos.filter(c=>c.estado==='Entregado'&&c.fecha_entrega_real>=lunStr&&c.fecha_entrega_real<=domStr);
    const cods=new Set(coms.map(c=>c.equipo_cod));
    lista=eqs.filter(e=>cods.has(e.codigo_interno));
    titulo='Entregados esta semana';
  } else if(filtro==='atrasados'){
    const coms=S.compromisos.filter(c=>{
      if(c.estado==='Entregado') return false;
      const eq=S.equipos.find(e=>e.codigo_interno===c.equipo_cod);
      return c.fecha_limite<hoy&&(eq?.estado_equipo||'En Proceso')==='En Proceso';
    });
    const cods=new Set(coms.map(c=>c.equipo_cod));
    lista=eqs.filter(e=>cods.has(e.codigo_interno));
    titulo='Atrasados';
  } else if(filtro==='a_tiempo'){
    lista=eqs.filter(e=>['En Proceso','Disponible','En Ruta'].includes(e.estado_equipo||'En Proceso'));
    titulo='A tiempo';
  } else if(filtro==='conFecha'){
    const cods=new Set(S.compromisos.filter(c=>c.estado!=='Entregado'&&c.fecha_limite>=hoy).map(c=>c.equipo_cod));
    lista=eqs.filter(e=>(e.estado_equipo||'En Proceso')==='En Proceso'&&cods.has(e.codigo_interno));
    titulo='Compromiso vigente';
  } else if(filtro==='sinFecha'){
    const cods=new Set(S.compromisos.filter(c=>c.estado!=='Entregado').map(c=>c.equipo_cod));
    lista=eqs.filter(e=>(e.estado_equipo||'En Proceso')==='En Proceso'&&!cods.has(e.codigo_interno));
    titulo='Sin fecha comprometida';
  }
  if(sitio&&sitio!=='todos') titulo+=` — ${sitio}`;
  // Mostrar en modal
  document.getElementById('m-det-t').textContent=titulo+` (${lista.length})`;
  document.getElementById('m-det-b').innerHTML=lista.length?
    lista.map(e=>{
      const com=S.compromisos.find(c=>c.equipo_cod===e.codigo_interno&&c.estado!=='Entregado');
      const est=e.estado_equipo||'En Proceso';
      return `<div class="card" style="margin-bottom:.4rem;cursor:pointer" onclick="openEqDetail('${e.codigo_interno}')">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:12px;font-weight:500">${e.nombre}</div>
            <div style="font-size:10px;color:var(--text2)">${e.codigo_interno} · ${e.tipo}</div>
          </div>
          <div style="text-align:right">
            ${eqEstadoBadge(est)}
            ${com?`<div style="font-size:10px;color:${com.fecha_limite<hoy?'var(--danger)':'var(--text2)'};margin-top:2px">${fmtDate(com.fecha_limite)}</div>`:''}
          </div>
        </div>
      </div>`;
    }).join('')
    :`<div class="es"><i class="ti ti-check"></i> Sin equipos en esta categoría</div>`;
  document.getElementById('m-det').classList.remove('hidden');
}

async function cambiarReq(cod, campo, valor){
  try{
    const patch={};
    patch[campo]=valor==='null'?null:valor;
    await supa.patch('equipos',`codigo_interno=eq.${cod}`,patch);
    const eq=S.equipos.find(e=>e.codigo_interno===cod);
    if(eq) eq[campo]=patch[campo];
    openEqDetail(cod);
  }catch(e){alert('Error: '+e.message);}
}

async function intentarDisponible(cod){
  const eots=S.ots.filter(o=>o.equipo_cod===cod);
  const abiertas=eots.filter(o=>!['finalizada'].includes(o.estado));
  if(abiertas.length>0){
    alert(`⚠ No se puede marcar como Disponible.\n\nHay ${abiertas.length} OT(s) abiertas:\n${abiertas.map(o=>`• ${o.id_ot} — ${o.nombre} (${EC[o.estado]?.lbl||o.estado})`).join('\n')}\n\nCierra o finaliza estas OTs primero.`);
    return;
  }
  await cambiarEstadoEquipo(cod,'Disponible');
}

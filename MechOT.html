function renderCalendario(tc){
  const hoy=today();
  const esSuper=S.role==='supervisor';
  const meses=esSuper?1:2;
  const coms=visibleCompromisos();

  // Agrupar por fecha
  const porFecha={};
  coms.forEach(c=>{
    if(!c.fecha_limite) return;
    if(!porFecha[c.fecha_limite]) porFecha[c.fecha_limite]=[];
    porFecha[c.fecha_limite].push(c);
  });

  let html='';

  for(let m=0;m<meses;m++){
    const ahora=new Date(hoy+'T12:00:00');
    const mesDate=new Date(ahora.getFullYear(), ahora.getMonth()+m, 1);
    const mesNom=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][mesDate.getMonth()];
    const anio=mesDate.getFullYear();
    const diasMes=new Date(anio,mesDate.getMonth()+1,0).getDate();
    const primerDia=(mesDate.getDay()+6)%7;
    const mesStr=`${anio}-${String(mesDate.getMonth()+1).padStart(2,'0')}`;
    const comsMes=coms.filter(c=>c.fecha_limite&&c.fecha_limite.startsWith(mesStr));

    html+=`<div class="card" style="margin-bottom:.65rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.65rem">
        <div style="font-weight:600;font-size:14px">${mesNom} ${anio}</div>
        <div style="font-size:11px;color:var(--text2)">${comsMes.length} compromisos</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:.3rem">
        ${['L','M','X','J','V','S','D'].map(d=>`<div style="text-align:center;font-size:9px;color:var(--text3);font-weight:600;padding:.2rem 0">${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">
        ${Array(primerDia).fill('<div></div>').join('')}
        ${Array.from({length:diasMes},(_,i)=>{
          const d=i+1;
          const fecha=`${anio}-${String(mesDate.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const comsDia=porFecha[fecha]||[];
          const esHoy=fecha===hoy;
          const esPasado=fecha<hoy;
          // Solo contar pendientes (no Entregado ni En Ruta)
          const pendientes=comsDia.filter(c=>c.estado!=='Entregado');
          const entregados=comsDia.filter(c=>c.estado==='Entregado');
          const hayPendientes=pendientes.length>0;

          let bg='transparent', col=esPasado?'var(--text3)':'var(--text)', border='transparent';
          if(esHoy){bg='var(--acc2)';col='#fff';border='var(--acc2)';}
          else if(comsDia.length>0){
            if(esPasado&&hayPendientes){
              // Pasado con pendientes → rojo
              bg='rgba(239,68,68,.15)';col='var(--danger)';border='rgba(239,68,68,.3)';
            } else if(esPasado&&!hayPendientes){
              // Pasado todos entregados → verde
              bg='rgba(16,185,129,.1)';col='var(--acc3)';border='rgba(16,185,129,.25)';
            } else {
              // Futuro con compromisos → azul/amarillo
              bg=pendientes.length>=3?'rgba(245,158,11,.12)':'rgba(59,130,246,.1)';
              col=pendientes.length>=3?'var(--acc)':'var(--acc2)';
              border=pendientes.length>=3?'rgba(245,158,11,.3)':'rgba(59,130,246,.25)';
            }
          }
          return `<div onclick="${comsDia.length?`verDiaCompromisos('${fecha}')`:''}" 
            style="text-align:center;padding:.3rem .1rem;border-radius:6px;cursor:${comsDia.length?'pointer':'default'};background:${bg};border:1px solid ${border}">
            <div style="font-size:12px;font-weight:${esHoy||comsDia.length?'600':'400'};color:${col}">${d}</div>
            ${comsDia.length?`<div style="font-size:8px;color:${col};font-family:var(--fm)">${hayPendientes?pendientes.length+'⏳':entregados.length+'✓'}</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // Lista de vencidos con pendientes
  const vencidos=coms.filter(c=>c.fecha_limite<hoy&&c.estado!=='Entregado').sort((a,b)=>a.fecha_limite.localeCompare(b.fecha_limite));
  const proximas=coms.filter(c=>c.fecha_limite>=hoy&&c.estado!=='Entregado').sort((a,b)=>a.fecha_limite.localeCompare(b.fecha_limite)).slice(0,10);

  html+=`
    ${vencidos.length?`<div class="shd"><i class="ti ti-alert-triangle" style="color:var(--danger)"></i> Pendientes vencidos (${vencidos.length})</div>
    ${vencidos.map(c=>{
      const eq=getEq(c.equipo_cod);
      const diff=Math.abs(Math.round((new Date(c.fecha_limite+'T12:00:00')-new Date(hoy+'T12:00:00'))/(86400000)));
      return `<div class="card" style="border-color:rgba(239,68,68,.3);margin-bottom:.4rem;padding:.6rem .75rem">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><div style="font-size:12px;font-weight:500">${eq.nombre}</div>
            <div style="font-size:10px;color:var(--text2)">${c.destino_envio} · ${eqEstadoBadge(eq.estado_equipo||'En Proceso')}</div></div>
          <div style="text-align:right"><div style="font-size:11px;color:var(--danger);font-weight:600">${diff}d atraso</div>
            <div style="font-size:10px;color:var(--text3);font-family:var(--fm)">${fmtDate(c.fecha_limite)}</div></div>
        </div></div>`;
    }).join('')}`:''}
    ${proximas.length?`<div class="shd"><i class="ti ti-calendar-event" style="color:var(--acc2)"></i> Próximas entregas pendientes</div>
    ${proximas.map(c=>{
      const eq=getEq(c.equipo_cod);
      const diff=Math.round((new Date(c.fecha_limite+'T12:00:00')-new Date(hoy+'T12:00:00'))/(86400000));
      const col=diff<=3?'var(--acc)':diff<=7?'var(--acc2)':'var(--acc3)';
      return `<div class="card" style="margin-bottom:.4rem;padding:.6rem .75rem">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><div style="font-size:12px;font-weight:500">${eq.nombre}</div>
            <div style="font-size:10px;color:var(--text2)">${c.destino_envio} · ${eqEstadoBadge(eq.estado_equipo||'En Proceso')}</div></div>
          <div style="text-align:right"><div style="font-size:11px;color:${col};font-weight:600">${diff===0?'HOY':diff+'d'}</div>
            <div style="font-size:10px;color:var(--text3);font-family:var(--fm)">${fmtDate(c.fecha_limite)}</div></div>
        </div></div>`;
    }).join('')}`:''}`;

  tc.innerHTML=html;
}

function verDiaCompromisos(fecha){
  const coms=visibleCompromisos().filter(c=>c.fecha_limite===fecha);
  if(!coms.length) return;
  const hoy=today();
  const esPasado=fecha<hoy;
  const pendientes=coms.filter(c=>c.estado!=='Entregado');
  const entregados=coms.filter(c=>c.estado==='Entregado');

  document.getElementById('m-com-t').textContent=`Compromisos ${fmtDate(fecha)}`;
  document.getElementById('m-com-b').innerHTML=`
    <div style="display:flex;gap:.4rem;margin-bottom:.65rem">
      <div class="sc" style="flex:1"><div class="sv" style="color:var(--danger);font-size:18px">${pendientes.length}</div><div class="sl">Pendientes</div></div>
      <div class="sc" style="flex:1"><div class="sv" style="color:var(--acc3);font-size:18px">${entregados.length}</div><div class="sl">Entregados</div></div>
    </div>
    ${pendientes.length?`<div class="shd"><i class="ti ti-clock" style="color:var(--danger)"></i> Pendientes (${pendientes.length})</div>
    ${pendientes.map(c=>{
      const eq=getEq(c.equipo_cod);

async function cambiarAreaEquipo(cod, nuevaArea){
  try{
    await supa.patch('equipos',`codigo_interno=eq.${cod}`,{area:nuevaArea});
    const eq=S.equipos.find(e=>e.codigo_interno===cod);
    if(eq) eq.area=nuevaArea;
    openEqDetail(cod);
  }catch(e){alert('Error: '+e.message);}
}

function renderCompromisos(tc){
  const hoy=today();
  const coms=visibleCompromisos().sort((a,b)=>a.fecha_limite.localeCompare(b.fecha_limite));
  const pend=coms.filter(c=>c.estado!=='Entregado');
  const done=coms.filter(c=>c.estado==='Entregado');
  const venc=pend.filter(c=>c.fecha_limite<hoy).length;
  const prox=pend.filter(c=>{const d=Math.round((new Date(c.fecha_limite+'T12:00:00')-new Date(hoy+'T12:00:00'))/(86400000));return d>=0&&d<=3;}).length;
  tc.innerHTML=`
    ${venc||prox?`<div class="card" style="border-color:rgba(239,68,68,.3);margin-bottom:.65rem">
      <div class="ct" style="color:var(--danger);margin-bottom:.3rem"><i class="ti ti-alert-triangle"></i> Atención</div>
      ${venc?`<div style="font-size:12px;color:var(--danger)">${venc} equipo(s) con fecha límite vencida</div>`:''}
      ${prox?`<div style="font-size:12px;color:var(--acc)">${prox} equipo(s) con entrega en ≤ 3 días</div>`:''}
    </div>`:''}
    <div class="shd"><i class="ti ti-flag"></i> Pendientes (${pend.length})</div>
    ${pend.map(c=>comCard(c)).join('')||`<div class="es" style="padding:1rem"><i class="ti ti-check"></i>Sin entregas pendientes</div>`}
    ${done.length?`<div class="shd"><i class="ti ti-circle-check" style="color:var(--acc3)"></i> Entregados (${done.length})</div>${done.map(c=>comCard(c)).join('')}`:''}`;
}

function renderAdminKPIs(tc){

  // Reutilizar la misma función dashKPIs del Jefe

    const codsConCom=new Set(comList.filter(c=>c.estado!=='Entregado').map(c=>c.equipo_cod));
    const atrasados=comList.filter(c=>{
      if(c.estado==='Entregado') return false;
      const eq=S.equipos.find(e=>e.codigo_interno===c.equipo_cod);
      return c.fecha_limite<hoy&&(eq?.estado_equipo||'En Proceso')==='En Proceso';
    }).length;
    const conFecha=comList.filter(c=>{
      if(c.estado==='Entregado') return false;
      const eq=S.equipos.find(e=>e.codigo_interno===c.equipo_cod);
      return c.fecha_limite>=hoy&&(eq?.estado_equipo||'En Proceso')==='En Proceso';

    const eqEnProceso=eqList.filter(e=>(e.estado_equipo||'En Proceso')==='En Proceso');
    const sinFecha=eqEnProceso.filter(e=>!codsConCom.has(e.codigo_interno)).length;
    const entSemana=comList.filter(c=>c.estado==='Entregado'&&c.fecha_entrega_real>=lunStr&&c.fecha_entrega_real<=domStr).length;

    const proxSem=comsSem.filter(c=>c.fecha_limite>=nextLunStr&&c.fecha_limite<=nextDomStr).length;

    ${(()=>{
      const otsSem=S.ots.filter(o=>o.fecha_programada>=lunStr&&o.fecha_programada<=domStr);

      const cumplSem=otsSem.length?Math.round(finSem/otsSem.length*100):0;
      const atrasSem=otsSem.filter(o=>o.estado!=='finalizada'&&o.fecha_programada<hoy);

    ${S.usuarios.map(u=>`<div class="card" style="margin-bottom:.5rem">
      <div style="display:flex;align-items:center;gap:.65rem">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--acc2);flex-shrink:0"><i class="ti ti-user"></i></div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:500;font-size:13px">${u.nombre}</div>
          <div style="font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.email}</div>
          <div style="display:flex;gap:.35rem;margin-top:.2rem">
            <span class="badge ${rolCfg[u.rol]?.cls||'b-new'}">${rolCfg[u.rol]?.lbl||u.rol}</span>
            <span style="font-size:9px;padding:1px 6px;border-radius:10px;background:rgba(139,92,246,.1);color:#c4b5fd;border:1px solid rgba(139,92,246,.25)">${u.sucursal}</span>
          </div>
        </div>
        <div style="display:flex;gap:.35rem">
          <button class="btn bg bsm" onclick="openEditUsuario('${u.id}')"><i class="ti ti-edit"></i></button>
          ${u.rol!=='admin'?`<button class="btn bd bsm" onclick="deleteUsuario('${u.id}')"><i class="ti ti-trash"></i></button>`:''}
        </div>
      </div>
    </div>`).join('')}`;
}

function openNewUsuario(){
  document.getElementById('m-usr-t').textContent='Nuevo Usuario';
  document.getElementById('m-usr-b').innerHTML=usuarioForm({id:'',email:'',nombre:'',rol:'supervisor',sucursal:'Lo Pinto'},'saveNewUsuario()');
  document.getElementById('m-usr').classList.remove('hidden');
}
function openEditUsuario(id){
  const u=S.usuarios.find(x=>x.id===id);
  document.getElementById('m-usr-t').textContent='Editar Usuario';
  document.getElementById('m-usr-b').innerHTML=usuarioForm(u,`saveEditUsuario('${id}')`);
  document.getElementById('m-usr').classList.remove('hidden');
}
function usuarioForm(u,saveFn){
  return `
    <div class="fg"><label class="fl">Nombre completo</label><input class="fi" id="u-nom" value="${u.nombre||''}" placeholder="Ej: Carlos Rojas"></div>
    <div class="fg"><label class="fl">Email (para ingresar)</label><input class="fi" id="u-email" type="email" value="${u.email||''}" placeholder="carlos@empresa.cl"></div>
    <div class="r2">
      <div class="fg"><label class="fl">Rol</label><select class="fs" id="u-rol" onchange="toggleSucFld(this.value)">
        <option ${u.rol==='supervisor'?'selected':''}>supervisor</option>
        <option ${u.rol==='planificador'?'selected':''}>planificador</option>
        <option ${u.rol==='jefe'?'selected':''}>jefe</option>
        <option ${u.rol==='admin'?'selected':''}>admin</option>
      </select></div>
      <div class="fg" id="suc-fld" ${u.rol==='admin'?'style="opacity:.4;pointer-events:none"':''}>
        <label class="fl">Sucursal</label><select class="fs" id="u-suc">
          <option ${u.sucursal==='Lo Pinto'?'selected':''}>Lo Pinto</option>
          <option ${u.sucursal==='La Negra'?'selected':''}>La Negra</option>
          <option ${u.sucursal==='todos'?'selected':''}>todos</option>
        </select>
      </div>
    </div>
    <div style="font-size:11px;color:var(--text2);background:var(--bg3);border-radius:7px;padding:.5rem .65rem;margin-bottom:.75rem">
      <i class="ti ti-info-circle" style="color:var(--acc2)"></i> El usuario ingresa escribiendo su email. Sin contraseña.
    </div>
    <button class="btn bp bfull" onclick="${saveFn}"><i class="ti ti-device-floppy"></i> Guardar</button>`;
}
function toggleSucFld(rol){
  const sf=document.getElementById('suc-fld');
  if(rol==='admin'){sf.style.opacity='.4';sf.style.pointerEvents='none';document.getElementById('u-suc').value='todos';}
  else{sf.style.opacity='1';sf.style.pointerEvents='';}
}
async function saveNewUsuario(){
  const d={email:document.getElementById('u-email').value.trim().toLowerCase(),nombre:document.getElementById('u-nom').value.trim(),rol:document.getElementById('u-rol').value,sucursal:document.getElementById('u-suc').value};
  if(!d.email||!d.nombre){alert('Completa email y nombre');return;}
  try{const res=await supa.post('usuarios',d);S.usuarios.push(res[0]);cm('m-usr');renderRole();}
  catch(e){alert('Error: '+e.message);}
}
async function saveEditUsuario(id){
  const d={email:document.getElementById('u-email').value.trim().toLowerCase(),nombre:document.getElementById('u-nom').value.trim(),rol:document.getElementById('u-rol').value,sucursal:document.getElementById('u-suc').value};
  if(!d.email||!d.nombre){alert('Completa email y nombre');return;}
  try{
    await supa.patch('usuarios',`id=eq.${id}`,d);
    const idx=S.usuarios.findIndex(u=>u.id===id);
    if(idx>=0) S.usuarios[idx]={...S.usuarios[idx],...d};
    cm('m-usr'); renderRole();
  }catch(e){alert('Error: '+e.message);}
}
async function deleteUsuario(id){
  if(!confirm('¿Eliminar este usuario?')) return;
  try{await supa.delete('usuarios',`id=eq.${id}`);S.usuarios=S.usuarios.filter(u=>u.id!==id);renderRole();}
  catch(e){alert('Error: '+e.message);}
}

function renderAdminInspecciones(tc){
  const todas=S.inspecciones;
  const conNC=todas.filter(i=>i.total_nc>0);
  const hoy=today();
  const hoyList=todas.filter(i=>i.fecha_inspeccion&&i.fecha_inspeccion.startsWith(hoy));

  // Filtro activo
  if(!S.inspFiltro) S.inspFiltro='todas';
  let lista=todas;
  if(S.inspFiltro==='nc') lista=conNC;
  else if(S.inspFiltro==='hoy') lista=hoyList;

  tc.innerHTML=`
    <!-- KPIs -->
    <div class="sg" style="margin-bottom:.65rem">
      <div class="sc"><div class="sv" style="color:var(--acc)">${todas.length}</div><div class="sl">Total</div></div>
      <div class="sc"><div class="sv" style="color:var(--danger)">${conNC.length}</div><div class="sl">Con NC</div></div>
      <div class="sc"><div class="sv" style="color:var(--acc3)">${hoyList.length}</div><div class="sl">Hoy</div></div>
      <div class="sc"><div class="sv" style="color:var(--acc2)">${todas.reduce((a,i)=>a+(i.total_nc||0),0)}</div><div class="sl">NC Total</div></div>
    </div>

    <!-- FILTROS -->
    <div style="display:flex;gap:.35rem;margin-bottom:.65rem">
      <button class="btn bsm ${S.inspFiltro==='todas'?'bp':'bg'}" onclick="S.inspFiltro='todas';renderRole()">Todas (${todas.length})</button>
      <button class="btn bsm ${S.inspFiltro==='nc'?'bp':'bg'}" onclick="S.inspFiltro='nc';renderRole()">Con NC (${conNC.length})</button>
      <button class="btn bsm ${S.inspFiltro==='hoy'?'bp':'bg'}" onclick="S.inspFiltro='hoy';renderRole()">Hoy (${hoyList.length})</button>
    </div>

    <!-- LISTA -->
    <div class="shd"><i class="ti ti-clipboard-check"></i> ${S.inspFiltro==='nc'?'Inspecciones con No Conformes':S.inspFiltro==='hoy'?'Inspecciones de hoy':'Todas las inspecciones'} (${lista.length})</div>
    ${lista.slice(0,30).map(ev=>{
      const eq=getEq(ev.equipo_cod);
      return `<div class="card" style="cursor:pointer;margin-bottom:.45rem;border-color:${ev.total_nc>0?'rgba(239,68,68,.25)':'var(--border)'}" onclick="verInspeccion('${ev.id_inspeccion}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:500">${eq.nombre}</div>
            <div style="font-size:11px;color:var(--text2);margin-top:.15rem">${eq.codigo_interno} · ${eq.sucursal}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:.15rem">${ev.tipo_inspeccion} · ${ev.inspector}</div>
            <div style="font-size:10px;color:var(--text3);font-family:var(--fm)">${fmtDT(ev.fecha_inspeccion)}</div>
          </div>
          <div style="text-align:right;flex-shrink:0;margin-left:.5rem">
            <div>
              <span style="color:var(--acc3);font-size:14px;font-weight:700">${ev.total_conformes}</span>
              <span style="color:var(--text3);font-size:11px">✓</span>
            </div>
            ${ev.total_nc>0?`<div>
              <span style="color:var(--danger);font-size:14px;font-weight:700">${ev.total_nc}</span>
              <span style="color:var(--text3);font-size:11px">✗ NC</span>
            </div>`:``}
            ${ev.total_na>0?`<div style="font-size:11px;color:#94a3b8">${ev.total_na} N/A</div>`:''}
            <div style="font-size:10px;color:var(--acc2);margin-top:.25rem">Ver detalle →</div>
          </div>
        </div>
      </div>`;
    }).join('')||`<div class="es"><i class="ti ti-clipboard"></i>Sin inspecciones</div>`}
    ${lista.length>30?`<div style="text-align:center;font-size:11px;color:var(--text2);padding:.5rem">Mostrando 30 de ${lista.length}</div>`:''}`;
}

// ===================== MODAL OUTSIDE CLICK =====================
document.querySelectorAll('.mo').forEach(m=>m.addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');}));
</script>
</body>
</html>
